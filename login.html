<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Phòng chấm MIV 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap">
<style>
:root{color-scheme:light;--bg:#f2f8f6;--panel:#fff;--line:#d7e7e3;--fg:#0f172a;--ink:#0f3d39;--muted:#475569;--brand:#0f766e;--brand-hover:#115e59;--brand-fill:#14b8a6;--brand-soft:#dff7f2;--bad:#b91c1c;--bad-soft:#fee2e2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 10% -10%,var(--brand-soft),transparent 60%),var(--bg);color:var(--fg);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:30px 26px;box-shadow:0 8px 28px rgba(15,61,57,.10)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 14px "Plus Jakarta Sans",system-ui,sans-serif;margin-bottom:14px}
h1{margin:0 0 4px;font:800 22px/1.25 "Plus Jakarta Sans","Be Vietnam Pro",system-ui,sans-serif;color:var(--ink)}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13.5px;font-weight:600;margin:14px 0 6px;color:var(--ink)}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit;font:inherit}
input:focus{outline:0;border-color:var(--brand-fill);box-shadow:0 0 0 3px var(--brand-soft)}
button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--brand-hover)}
button:focus-visible{outline:3px solid var(--brand-fill);outline-offset:2px}
.err{display:none;margin:0 0 6px;padding:9px 12px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
small{display:block;margin-top:16px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">MIV</div>
  <h1>Phòng chấm MIV 2026</h1>
  <p>Đăng nhập bằng tài khoản giám khảo được cấp.</p>
  <div class="err" id="err" role="alert"></div>
  <label for="u">Tên đăng nhập</label>
  <input id="u" name="u" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="p">Mật khẩu</label>
  <input id="p" name="p" type="password" autocomplete="current-password" required>
  <button type="submit">Đăng nhập</button>
  <small>Hạng mục Sản phẩm công nghệ số tiềm năng · Giải thưởng Make in Viet Nam 2026</small>
</form>
<script>
const e = new URLSearchParams(location.search).get("e");
if (e) { const el = document.getElementById("err"); el.textContent = e === "2" ? "Sai quá nhiều lần, thử lại sau 15 phút." : "Sai tên đăng nhập hoặc mật khẩu."; el.style.display = "block"; }
</script>
</body>
</html>
