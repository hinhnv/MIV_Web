<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Phòng chấm MIV 2026</title>
<style>
:root{--bg:#edf1f5;--panel:#fff;--line:#d8e0e9;--fg:#1a2532;--muted:#5a6878;--hdr:#1c4a73;--brand:#2a6aad;--bad:#bb3a2e;--bad-soft:#f8e0dc}
@media (prefers-color-scheme:dark){:root{--bg:#0e1620;--panel:#15202b;--line:#2a3a4b;--fg:#e3eaf1;--muted:#9aabbc;--hdr:#0f2a44;--brand:#5c9ee0;--bad:#ec7a6c;--bad-soft:#3d1f1b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 24px;box-shadow:0 3px 10px rgba(16,38,66,.06)}
h1{margin:0 0 4px;font-size:20px;color:var(--fg)}
p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid var(--brand);outline-offset:1px}
button{margin-top:22px;width:100%;padding:11px;border:0;border-radius:6px;background:var(--hdr);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{display:none;margin:0 0 6px;padding:9px 12px;border-radius:6px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Phòng chấm MIV 2026</h1>
  <p>Đăng nhập bằng tài khoản giám khảo được cấp.</p>
  <div class="err" id="err" role="alert"></div>
  <label for="u">Tên đăng nhập</label>
  <input id="u" name="u" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="p">Mật khẩu</label>
  <input id="p" name="p" type="password" autocomplete="current-password" required>
  <button type="submit">Đăng nhập</button>
</form>
<script>
const e = new URLSearchParams(location.search).get("e");
if (e) { const el = document.getElementById("err"); el.textContent = e === "2" ? "Sai quá nhiều lần, thử lại sau 15 phút." : "Sai tên đăng nhập hoặc mật khẩu."; el.style.display = "block"; }
</script>
</body>
</html>
