<title>Phòng chấm MIV 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: thanh tiêu đề trắng + cột điều hướng trái; trang chấm chia 2 cột: phiếu chấm (trái) | bảng tổng điểm + hồ sơ (phải, dính khi cuộn).
   Một giao diện sáng duy nhất (không đổi theo chế độ tối) cho dễ đọc. Màu: teal = điều hướng/hành động, chàm = AI, cam = điểm giám khảo. */
:root{
  color-scheme:light;
  --bg:#f2f8f6; --panel:#ffffff; --panel2:#f6fbfa; --line:#d7e7e3; --line2:#e8f2ef;
  --fg:#0f172a; --ink:#0f3d39; --muted:#475569; --faint:#8a99ab;
  --brand:#0f766e; --brand-hover:#115e59; --brand-fill:#14b8a6; --brand-soft:#dff7f2; --brand-soft2:#effbf8;
  --ai:#4f46e5; --ai-fill:#818cf8; --ai-soft:#eef0ff;
  --gk:#c2410c; --gk-fill:#f97316; --gk-soft:#fff1e6; --gk-line:#fdba74;
  --good:#15803d; --good-soft:#dcfce7; --ok:#0369a1; --ok-soft:#e0f2fe;
  --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --mark:#fde047; --mark-fg:#0f172a;
  --hdr:#ffffff; --hdr-fg:#0f3d39; --hdr-muted:#475569;
  --shadow:0 1px 2px rgba(15,61,57,.05),0 4px 14px rgba(15,61,57,.06);
  --shadow-lg:0 8px 28px rgba(15,61,57,.12);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Plus Jakarta Sans","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --hdr-h:64px; --side-w:220px; --r:12px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr-h) + 16px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-fill);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;color:var(--ink);letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);border-bottom:1px solid var(--line)}
.top-in{min-height:var(--hdr-h);display:flex;align-items:center;gap:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;margin-right:auto}
.logo{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.02em;flex:none}
.bt b{display:block;font-family:var(--f-disp);font-size:17px;font-weight:800;color:var(--ink);line-height:1.15}
.bt span{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.search{flex:1 1 360px;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 8px 4px 12px;order:2}
.search:focus-within{border-color:var(--brand-fill);box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{flex:none;color:var(--muted)}
.search input[type=search]{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:7px 0}
.search input::placeholder{color:var(--faint)}
.search .cnt{font-size:12.5px;color:var(--muted);white-space:nowrap}
.search label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.iconbtn{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:2px 8px;border-radius:7px;font-size:13px}
.who{display:flex;align-items:center;gap:12px;order:3}
.sync{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok{color:var(--good);background:var(--good-soft);border-color:transparent}.sync.ok i{background:var(--good)}
.sync.saving{color:var(--warn);background:var(--warn-soft);border-color:transparent}.sync.saving i{background:var(--warn)}
.sync.err{color:var(--bad);background:var(--bad-soft);border-color:transparent}.sync.err i{background:var(--bad)}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--ink)}
.me img{width:32px;height:32px;border-radius:50%;background:var(--brand-soft)}
.me small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:calc(100vh - var(--hdr-h))}
.side{background:var(--panel);border-right:1px solid var(--line);padding-block:14px;padding-left:max(0px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px}
.side a{display:flex;align-items:center;gap:11px;margin:0 10px;padding:10px 12px;color:var(--muted);text-decoration:none;border-radius:9px;font-weight:600;font-size:14.5px}
.side a:hover{background:var(--panel2);color:var(--ink)}
.side a.on{color:var(--brand);background:var(--brand-soft)}
.side a svg{flex:none}
.side a .badge{margin-left:auto;font-size:11.5px;background:var(--gk-soft);color:var(--gk);padding:1px 7px;border-radius:999px}
.side .prog{margin:14px 14px 4px;padding:12px;border-radius:10px;background:var(--brand-soft2);border:1px solid var(--line2);font-size:12.5px;color:var(--muted)}
.side .prog b{color:var(--ink);font-size:15px}
.side .note{margin:auto 14px 6px;padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.45}
main{min-width:0;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none;font-weight:600}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.banner{padding:11px 14px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);border:1px solid #fde68a}
.banner b{color:var(--warn)}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>h2{font-size:15.5px;padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2 small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.card .body{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi b{font-family:var(--f-disp);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--ink)}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.ai b{color:var(--ai)}.kpi.gk b{color:var(--gk)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:linear-gradient(120deg,var(--brand-soft) 0%,#fff 70%);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h1{font-size:24px}
.hero p{margin:6px 0 12px;color:var(--muted)}
.bar{height:12px;border-radius:99px;background:var(--line2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand-fill)}
.bar.gk i{background:var(--gk-fill)}.bar.ai i{background:var(--ai-fill)}
.bar.sm{height:8px}

/* ---------- pills & buttons ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.g-xs{background:#bbf7d0;color:#14532d}.g-t{background:var(--good-soft);color:var(--good)}.g-k{background:var(--ok-soft);color:var(--ok)}
.g-tb{background:var(--warn-soft);color:var(--warn)}.g-y{background:var(--bad-soft);color:var(--bad)}
.c-cao{background:var(--good-soft);color:var(--good)}.c-tb{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}.c-thap{background:var(--bad-soft);color:var(--bad)}
.st-done{background:var(--good-soft);color:var(--good)}.st-doing{background:var(--warn-soft);color:var(--warn)}.st-todo{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink);min-height:40px;transition:background .15s,border-color .15s,color .15s}
.btn:hover{border-color:var(--brand-fill);color:var(--brand);background:var(--brand-soft2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-hover);color:#fff}
.btn.gk{background:var(--gk);border-color:var(--gk);color:#fff}
.btn.gk:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:32px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .n{font-size:11.5px;background:var(--panel2);border-radius:999px;padding:0 6px;margin-left:4px}

/* ---------- table ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);font-size:14px}
.t th,.t td{border-bottom:1px solid var(--line2);padding:10px 10px;text-align:left;vertical-align:middle}
.t thead th{background:var(--panel2);font-weight:700;color:var(--ink);font-size:12.5px;white-space:nowrap;position:sticky;top:0;z-index:1;text-transform:uppercase;letter-spacing:.03em}
.t thead th.sortable{cursor:pointer;user-select:none}
.t thead th.sortable:hover{color:var(--brand)}
.t thead th .ar{opacity:.45;font-size:10px;margin-left:3px}
.t tbody tr{cursor:pointer;transition:background .12s}
.t tbody tr:hover td{background:var(--brand-soft2)}
.t td.c,.t th.c{text-align:center}
.t .nm{font-weight:700;color:var(--ink)}
.t .co{font-size:12.5px;color:var(--muted)}
.t .hit{font-size:12px;color:var(--muted);margin-top:3px}
.sc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;min-width:24px}
.sc b{font-weight:700}
.sc s{font-size:10.5px;color:var(--faint)}
.sc.chg b{color:var(--gk)}
.tot{font-family:var(--f-disp);font-weight:800;font-size:16px;color:var(--ink)}
.tot.ai{color:var(--ai)}.tot.gk{color:var(--gk)}
.go{color:var(--brand);font-weight:700;white-space:nowrap;text-decoration:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toolbar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.inp:focus{border-color:var(--brand-fill);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}

/* ---------- charts & lists ---------- */
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
.track{height:9px;background:var(--line2);border-radius:5px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.track i.ai{background:var(--ai-fill)}.track i.gk{background:var(--gk-fill)}.track i.br{background:var(--brand-fill)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;font-family:var(--f-body);font-weight:500}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .grid-l{stroke:var(--line2)}
svg.chart .b-ai{fill:var(--ai-fill)}svg.chart .b-gk{fill:var(--gk-fill)}
svg.chart .v{fill:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column}
.list .row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-radius:8px;text-decoration:none;color:inherit}
.list .row:hover{background:var(--brand-soft2)}
.list .rk{font-family:var(--f-disp);font-weight:800;color:var(--faint);text-align:center}
.list .row .t1{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.list .row .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- trang chấm ---------- */
.phead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.phead .eyebrow{font-size:12.5px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.06em}
.phead h1{font-size:25px;line-height:1.25;margin:4px 0 6px}
.phead .meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.phead .nav2{display:flex;gap:8px;flex-wrap:wrap}
.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,1fr);gap:18px;align-items:start}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line2)}
.sheet>header h2{font-size:17px}
.sheet>header .hint{font-size:12.5px;color:var(--muted)}
.grp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--brand-soft2);border-bottom:1px solid var(--line2);font-weight:700;color:var(--ink);font-size:13.5px}
.grp span{font-weight:600;color:var(--muted);font-size:13px}
.grp b{color:var(--gk);font-family:var(--f-disp)}
.crit{padding:16px 18px;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:12px;scroll-margin-top:calc(var(--hdr-h) + 12px)}
.crit:last-child{border-bottom:0}
.crit.chg{background:linear-gradient(90deg,var(--gk-soft),transparent 40%)}
.c-top{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start}
.c-top .no{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);font-family:var(--f-disp);font-weight:800;display:grid;place-items:center}
.c-name{font-weight:700;color:var(--ink);line-height:1.35}
.c-name small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.c-score{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.c-score .aiv{font-size:12.5px;font-weight:700;color:var(--ai);background:var(--ai-soft);border:1px solid transparent;border-radius:999px;padding:3px 9px}
button.aiv:hover{border-color:var(--ai-fill)}
.c-score .mv{font-family:var(--f-disp);font-size:30px;font-weight:800;color:var(--gk);line-height:1}
.c-score .of{font-size:13px;color:var(--muted);font-weight:600}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{min-width:40px;height:40px;padding:0 6px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14.5px;color:var(--ink);position:relative;font-variant-numeric:tabular-nums}
.picker button:hover:not(:disabled){border-color:var(--gk-line);background:var(--gk-soft)}
.picker button.ai{border-color:var(--ai-fill);border-style:dashed}
.picker button.ai::after{content:"AI";position:absolute;top:-8px;right:-6px;font-size:9.5px;font-weight:800;background:var(--ai);color:#fff;border-radius:5px;padding:0 4px;line-height:15px}
.picker button.on{background:var(--gk);border-color:var(--gk);color:#fff;border-style:solid}
.picker button:disabled{cursor:not-allowed;opacity:.6}
.slide{display:grid;grid-template-columns:40px minmax(0,1fr) 40px 64px;gap:8px;align-items:center}
.slide .step{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:700;color:var(--gk)}
.slide .step:hover:not(:disabled){background:var(--gk-soft);border-color:var(--gk-line)}
.slide input[type=number]{height:40px;border:1px solid var(--gk-line);border-radius:9px;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--gk);background:var(--gk-soft);-moz-appearance:textfield;width:100%}
.slide input[type=number]::-webkit-inner-spin-button,.slide input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.rgw{position:relative;padding-top:6px;padding-bottom:14px}
.rg{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0;display:block}
.rg::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(to right,var(--gk-fill) 0 var(--p,0%),var(--line) var(--p,0%) 100%)}
.rg::-moz-range-track{height:8px;border-radius:99px;background:var(--line)}
.rg::-moz-range-progress{height:8px;border-radius:99px;background:var(--gk-fill)}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--gk);margin-top:-8px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rg::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--gk)}
.rg:disabled{cursor:not-allowed;opacity:.6}
.ai-tick{position:absolute;top:4px;width:3px;height:26px;border-radius:2px;background:var(--ai);transform:translateX(-50%);pointer-events:none}
.ai-tick::after{content:"AI";position:absolute;top:27px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--ai)}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);padding:0 4px;margin-top:-12px}
.band{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.band b{color:var(--ink)}

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("miv-data").textContent);
const C = D.criteria, P = D.products, N = P.length;
const byStt = new Map(P.map(p => [p.stt, p]));
const $ = s => document.querySelector(s);
const main = $("#main");

/* ---------- state ---------- */
const S = {
  route: "tong-quan", q: "", terms: [], hlOn: true,
  sort: { key: "stt", dir: 1 }, f: { text: "", grade: "" }, ttab: "all", showTC: false,
  basis: "ai", cmFilter: "", tab: "hoso", openR: {}, openCm: {},
  mode: "local", canWrite: false, dbReady: false, myId: null, meName: "", meAvatar: "",
  judges: {}, mine: null, profiles: {}, drafts: {}, savedAt: null,
  db: null, user: null, dl: null, dragging: false, pendingRender: false,
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FOLD = new Map();
function foldChar(ch) { let r = FOLD.get(ch); if (r !== undefined) return r; r = (ch === "đ" || ch === "Đ") ? "d" : ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); FOLD.set(ch, r); return r; }
function fold(s) { let o = ""; for (const ch of String(s || "")) o += foldChar(ch); return o; }
function foldMap(s) { let n = ""; const st = [], en = []; let i = 0; for (const ch of s) { const f = foldChar(ch); for (let k = 0; k < f.length; k++) { n += f[k]; st.push(i); en.push(i + ch.length); } i += ch.length; } return { n, st, en }; }
function hl(text) {
  text = text == null ? "" : String(text);
  if (!S.hlOn || !S.terms.length || !text) return esc(text);
  const { n, st, en } = foldMap(text); const rs = [];
  for (const t of S.terms) { let from = 0, ix; while ((ix = n.indexOf(t, from)) !== -1) { rs.push([st[ix], en[ix + t.length - 1]]); from = ix + t.length; } }
  if (!rs.length) return esc(text);
  rs.sort((a, b) => a[0] - b[0]); const m = [rs[0].slice()];
  for (const r of rs.slice(1)) { const l = m[m.length - 1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else m.push(r.slice()); }
  let o = "", p = 0; for (const [a, b] of m) { o += esc(text.slice(p, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; p = b; }
  return o + esc(text.slice(p));
}
const hasHit = text => S.terms.length && S.terms.some(t => fold(text).includes(t));
const URL_RE = /(https?:\/\/[^\s<>"')\]]+)/g;
function rich(text) { return String(text || "").split(URL_RE).map((s, i) => i % 2 ? `<a href="${esc(s.replace(/[.,;:]+$/, ""))}" target="_blank" rel="noopener noreferrer">${hl(s)}</a>` : hl(s)).join(""); }
const fmt1 = v => v == null ? "—" : (Math.round(v * 10) / 10).toLocaleString("vi-VN");
const fmtT = iso => { try { return new Date(iso).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const fmtHM = d => { try { return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
function grade(t) { if (t == null) return null; for (const [th, lb] of D.grades) if (t >= th) return lb; return "Yếu"; }
const GCLS = { "Xuất sắc": "g-xs", "Tốt": "g-t", "Khá": "g-k", "Trung bình": "g-tb", "Yếu": "g-y" };
const gpill = t => { const g = grade(t); return g ? `<span class="pill ${GCLS[g]}">${g}</span>` : `<span class="mut">—</span>`; };
const cpill = (c, label) => { const k = fold(c); const cls = k.startsWith("cao") ? "c-cao" : k.startsWith("thap") ? "c-thap" : "c-tb"; return `<span class="pill ${cls}">${esc(label || c || "—")}</span>`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const band = (c, v) => (c.anchors || []).find(([lo, hi]) => v >= lo && v <= hi);

/* ---------- search corpus ---------- */
const FIELDS = p => [
  ["Tên", p.name], ["Doanh nghiệp", p.company], ["Mô tả", p.desc], ["Link", p.link + " " + p.website],
  ["Tài liệu", p.files.map(f => f.name).join(" ")], ["Nhận xét AI", [p.ai.summary, p.ai.strengths, p.ai.weaknesses, p.ai.verify].join(" ")],
  ...p.ai.r.map((r, i) => ["Lý do TC" + (i + 1), r]),
];
const CORPUS = new Map(P.map(p => [p.stt, FIELDS(p).map(([k, v]) => [k, fold(v)])]));
function matchInfo(p) {
  if (!S.terms.length) return { ok: true, where: [] };
  const fields = CORPUS.get(p.stt).slice();
  const cms = CALC.cms.filter(c => c.stt === p.stt).map(c => fold(c.text)).join(" ");
  if (cms) fields.push(["Góp ý", cms]);
  const notes = Object.values(CALC.J).map(d => (d.notes || {})[p.stt] || "").join(" ");
  if (notes.trim()) fields.push(["Ghi chú GK", fold(notes)]);
  const ok = S.terms.every(t => fields.some(([, v]) => v.includes(t)));
  return { ok, where: ok ? fields.filter(([, v]) => S.terms.some(t => v.includes(t))).map(([k]) => k) : [] };
}

/* ---------- scoring model (giữ nguyên cấu trúc dữ liệu cũ) ---------- */
const emptyDoc = () => ({ scores: {}, notes: {}, confirmed: {}, comments: [], updatedAt: null });
function judgeDocs() { const j = Object.assign({}, S.judges); if (S.myId && S.mine) j[S.myId] = S.mine; return j; }
function own(doc, stt, tt) { const v = doc && doc.scores && doc.scores[stt] ? doc.scores[stt][tt] : null; return typeof v === "number" ? v : null; }
function eff(doc, p, i) { const v = own(doc, p.stt, i + 1); return v == null ? p.ai.s[i] : v; }
function scored(doc, stt) { if (!doc) return false; if (doc.confirmed && doc.confirmed[stt]) return true; const s = doc.scores && doc.scores[stt]; return !!s && Object.values(s).some(v => typeof v === "number"); }
const isDone = stt => !!(S.mine && S.mine.confirmed && S.mine.confirmed[stt]);
const status = stt => isDone(stt) ? "done" : scored(S.mine, stt) ? "doing" : "todo";
const ST = { done: ["Đã chấm", "st-done"], doing: ["Đang chấm", "st-doing"], todo: ["Chưa chấm", "st-todo"] };
const spill = stt => { const [l, c] = ST[status(stt)]; return `<span class="pill ${c}">${status(stt) === "done" ? "✓ " : ""}${l}</span>`; };
const aiTotal = p => sum(p.ai.s);
const jTotal = (doc, p) => sum(C.map((c, i) => eff(doc, p, i)));
function allComments() {
  const out = []; const J = judgeDocs();
  for (const [id, d] of Object.entries(J)) for (const c of (d.comments || [])) if (c && byStt.has(c.stt)) out.push(Object.assign({ by: id }, c));
  return out.sort((a, b) => String(b.at).localeCompare(String(a.at)));
}
let CALC = null;
function compute() {
  const J = judgeDocs(); const ids = Object.keys(J); const per = new Map();
  for (const p of P) {
    const who = ids.filter(id => scored(J[id], p.stt));
    const crit = C.map((c, i) => who.length ? mean(who.map(id => eff(J[id], p, i))) : null);
    per.set(p.stt, { ai: aiTotal(p), mine: S.mine ? jTotal(S.mine, p) : aiTotal(p), n: who.length, who, avg: mean(who.map(id => jTotal(J[id], p))), crit });
  }
  const cms = allComments(); const cmCount = new Map(); for (const c of cms) cmCount.set(c.stt, (cmCount.get(c.stt) || 0) + 1);
  const done = P.filter(p => isDone(p.stt)).length;
  CALC = { J, ids, per, cms, cmCount, done, rankAI: rankBy(p => per.get(p.stt).ai) };
}
function rankBy(fn) { const v = P.map(p => [p.stt, fn(p)]); const m = new Map(); for (const [s, x] of v) m.set(s, 1 + v.filter(([, y]) => y != null && x != null && y > x).length); return m; }
function nextTodo(fromStt) { const i = P.findIndex(p => p.stt === fromStt); for (let k = 1; k <= N; k++) { const p = P[(i + k + N) % N]; if (!isDone(p.stt)) return p; } return null; }
function basisVal(p, b) { const r = CALC.per.get(p.stt); return b === "mine" ? r.mine : b === "avg" ? r.avg : r.ai; }
const BASIS = { ai: "Điểm AI", mine: "Điểm của tôi", avg: "TB hội đồng" };

/* ---------- people ---------- */
function person(id) { const p = S.profiles[id]; const name = (p && p.name) || (id === S.myId ? (S.meName || "Bạn") : "Giám khảo"); return { name: id === S.myId ? name + " (bạn)" : name, avatar: (p && p.avatarUrl) || (id === S.myId ? S.meAvatar : "") }; }
let profKey = "";
async function refreshProfiles() {
  if (!S.user) return; const ids = Object.keys(judgeDocs()); if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); const key = ids.map(i => i + ":" + ((ps[i] && ps[i].name) || "")).join("|"); S.profiles = ps; if (key !== profKey) { profKey = key; render(); } } catch (e) { }
}
const DEF_AV = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%2399f6e4'/%3E%3C/svg%3E";
const av = (id, size) => `<img ${size ? `style="width:${size}px;height:${size}px;border-radius:50%"` : ""} src="${esc(person(id).avatar || DEF_AV)}" alt="">`;

/* ---------- common bits ---------- */
function banner() {
  if (S.mode === "local") return `<div class="banner"><b>Bản xem tĩnh.</b> Chưa kết nối được dữ liệu chung nên chỉ hiện điểm AI.</div>`;
  if (S.mode === "stale") return `<div class="banner"><b>Chưa tải được dữ liệu chung.</b> Điểm và góp ý có thể chưa đầy đủ; trang tự cập nhật khi kết nối lại.</div>`;
  if (!S.canWrite) return `<div class="banner"><b>Bạn đang ở quyền Xem.</b> Xem được điểm và góp ý của mọi người nhưng chưa chấm được. Nhờ quản trị cấp quyền chấm.</div>`;
  return "";
}
function basisSeg() { return `<span class="seg" role="group" aria-label="Căn cứ xếp hạng">${Object.entries(BASIS).map(([k, l]) => `<button data-act="basis" data-v="${k}" class="${S.basis === k ? "on" : ""}" aria-pressed="${S.basis === k}">${l}</button>`).join("")}</span>`; }
function listRow(p, rank, val, b) {
  const disp = b === "diff" ? `<span class="tot ${val >= 0 ? "gk" : "ai"}">${val > 0 ? "+" : ""}${fmt1(val)}</span>` : `<span class="tot ${b === "ai" ? "ai" : "gk"}">${fmt1(val)}</span>`;
  return `<a class="row" href="#sp-${p.stt}"><span class="rk">${rank}</span><span style="min-width:0"><div class="t1">${hl(p.name)}</div><div class="t2">${hl(p.company)}</div></span>${disp}</a>`;
}
function cmItem(c, withProduct) {
  const p = byStt.get(c.stt); const pp = person(c.by);
  const crit = c.tt ? `TC${c.tt}. ${C[c.tt - 1].short}` : "Góp ý chung";
  return `<div class="cm">${av(c.by)}<div style="min-width:0"><div class="h"><b>${esc(pp.name)}</b><span>${fmtT(c.at)}</span>${withProduct ? `<a href="#sp-${c.stt}">${esc(p.stt + ". " + p.name)}</a>` : ""}<span class="tag">${esc(crit)}</span>${c.by === S.myId && S.canWrite ? `<button class="del" data-act="delcm" data-id="${esc(c.id)}">Xóa</button>` : ""}</div><div class="x">${hl(c.text)}</div></div></div>`;
}

/* ---------- Tổng quan ---------- */
function vDashboard() {
  const per = CALC.per; const rows = P.map(p => per.get(p.stt));
  const aiAvg = mean(rows.map(r => r.ai)); const withGK = rows.filter(r => r.n > 0); const gkAvg = mean(withGK.map(r => r.avg));
  const judgesActive = CALC.ids.filter(id => P.some(p => scored(CALC.J[id], p.stt)) || (CALC.J[id].comments || []).length).length;
  const nx = nextTodo(0) || null; const pct = Math.round(CALC.done / N * 100);
  const kpi = (l, v, e, cls = "") => `<div class="kpi ${cls}"><span>${l}</span><b>${v}</b><em>${e}</em></div>`;
  const bins = [[0, 40, "< 40"], [40, 50, "40–49"], [50, 60, "50–59"], [60, 70, "60–69"], [70, 80, "70–79"], [80, 101, "≥ 80"]];
  const hA = bins.map(([a, b]) => rows.filter(r => r.ai >= a && r.ai < b).length), hG = bins.map(([a, b]) => withGK.filter(r => r.avg >= a && r.avg < b).length);
  const hmax = Math.max(4, ...hA, ...hG), W = 520, H = 220, pl = 28, pb = 26, pt = 16, cw = (W - pl - 8) / bins.length, bw = withGK.length ? cw * 0.34 : cw * 0.5;
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Phân bố tổng điểm">`;
  for (const t of [0, Math.round(hmax / 2), hmax]) { const y = H - pb - (H - pb - pt) * t / hmax; svg += `<line class="grid-l" x1="${pl}" x2="${W - 4}" y1="${y}" y2="${y}"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end">${t}</text>`; }
  bins.forEach((bn, i) => {
    const x0 = pl + i * cw + cw / 2;
    const draw = (v, cls, dx) => { const h = (H - pb - pt) * v / hmax, x = x0 + dx; return `<rect class="${cls}" x="${x}" y="${H - pb - h}" width="${bw}" height="${h}" rx="4"/>` + (v ? `<text class="v" x="${x + bw / 2}" y="${H - pb - h - 5}" text-anchor="middle">${v}</text>` : ""); };
    svg += withGK.length ? draw(hA[i], "b-ai", -bw - 2) + draw(hG[i], "b-gk", 2) : draw(hA[i], "b-ai", -bw / 2);
    svg += `<text x="${x0}" y="${H - 8}" text-anchor="middle">${bn[2]}</text>`;
  });
  svg += `</svg>`;
  const critRows = C.map((c, i) => {
    const a = mean(P.map(p => p.ai.s[i])) / c.max;
    const g = withGK.length ? mean(P.filter(p => per.get(p.stt).n).map(p => per.get(p.stt).crit[i])) / c.max : null;
    return `<div class="hbar"><div><div class="small" style="margin-bottom:4px;font-weight:600">${c.tt}. ${esc(c.short)} <span class="mut">/${c.max}</span></div><div class="track"><i class="ai" style="width:${(a * 100).toFixed(1)}%"></i></div>${g != null ? `<div class="track" style="margin-top:4px"><i class="gk" style="width:${(g * 100).toFixed(1)}%"></i></div>` : ""}</div><div class="small num" style="text-align:right;font-weight:700;color:var(--ai)">${Math.round(a * 100)}%${g != null ? `<br><span style="color:var(--gk)">${Math.round(g * 100)}%</span>` : ""}</div></div>`;
  }).join("");
  const b = S.basis;
  const top = P.filter(p => basisVal(p, b) != null).sort((x, y) => basisVal(y, b) - basisVal(x, b) || x.stt - y.stt).slice(0, 10);
  const diverge = P.filter(p => per.get(p.stt).n).map(p => [p, per.get(p.stt).avg - per.get(p.stt).ai]).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1])).slice(0, 6);
  const low = P.slice().sort((x, y) => per.get(x.stt).ai - per.get(y.stt).ai).slice(0, 6);
  const jp = CALC.ids.map(id => [id, P.filter(p => (CALC.J[id].confirmed || {})[p.stt]).length, (CALC.J[id].comments || []).length]).filter(x => x[1] || x[2]).sort((a, c) => c[1] - a[1]);
  const jpHtml = jp.length ? jp.map(([id, n, c]) => `<div class="hbar" style="margin-bottom:10px"><div><div class="row-flex small" style="gap:7px;margin-bottom:4px">${av(id, 20)}<b>${esc(person(id).name)}</b><span class="mut">· ${c} góp ý</span></div><div class="track"><i class="br" style="width:${(n / N * 100).toFixed(1)}%"></i></div></div><div class="small num" style="font-weight:700">${n}/${N}</div></div>`).join("") : `<div class="empty">Chưa có giám khảo nào xác nhận chấm.</div>`;
  const hello = S.meName ? `Chào ${esc(S.meName)}` : "Tiến độ chấm của bạn";
  return `<div class="wrap">
    ${banner()}
    <section class="hero">
      <div><h1>${hello}</h1><p>Bạn đã xác nhận chấm <b>${CALC.done}/${N}</b> sản phẩm (${pct}%). Mỗi sản phẩm có sẵn điểm AI để tham khảo — chỉ cần sửa tiêu chí bạn không đồng ý rồi bấm <b>Xác nhận</b>.</p>
        <div class="bar"><i style="width:${pct}%"></i></div></div>
      <div style="display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:240px">
        ${nx ? `<a class="btn pri" href="#sp-${nx.stt}">${CALC.done ? "Tiếp tục chấm" : "Bắt đầu chấm"} →</a><span class="small mut" style="text-align:center">Tiếp theo: ${esc(nx.stt + ". " + nx.name.slice(0, 48))}</span>` : `<span class="pill st-done" style="justify-content:center;padding:10px">✓ Đã chấm xong ${N}/${N}</span>`}
        <a class="btn" href="#bang-diem">Mở danh sách sản phẩm</a>
      </div>
    </section>
    <div class="kpis">
      ${kpi("Sản phẩm", N, esc(D.meta.category))}
      ${kpi("Điểm TB · AI", fmt1(aiAvg), "thang 100", "ai")}
      ${kpi("Điểm TB · hội đồng", fmt1(gkAvg), withGK.length ? withGK.length + " SP có điểm GK" : "chưa có điểm giám khảo", "gk")}
      ${kpi("Giám khảo tham gia", judgesActive, "đã chấm hoặc góp ý")}
      ${kpi("Góp ý", CALC.cms.length, "trên tất cả sản phẩm")}
    </div>
    <div class="grid g2">
      <section class="card"><h2>Phân bố tổng điểm <span class="legend"><span><i style="background:var(--ai-fill)"></i>AI</span>${withGK.length ? `<span><i style="background:var(--gk-fill)"></i>TB hội đồng</span>` : ""}</span></h2><div class="body">${svg}</div></section>
      <section class="card"><h2>Mức đạt theo tiêu chí <small>% điểm tối đa · <span style="color:var(--ai)">AI</span>${withGK.length ? ` / <span style="color:var(--gk)">hội đồng</span>` : ""}</small></h2><div class="body" style="display:flex;flex-direction:column;gap:10px">${critRows}</div></section>
    </div>
    <div class="grid g3">
      <section class="card"><h2>Top 10 ${basisSeg()}</h2><div class="body list">${top.length ? top.map((p, i) => listRow(p, i + 1, basisVal(p, b), b)).join("") : `<div class="empty">Chưa có sản phẩm nào được giám khảo chấm.</div>`}</div></section>
      <section class="card"><h2>Cần xem kỹ <small>${diverge.length ? "chênh lệch AI và hội đồng lớn nhất" : "điểm AI thấp nhất"}</small></h2><div class="body list">${(diverge.length ? diverge.map(([p, d], i) => listRow(p, i + 1, d, "diff")) : low.map((p, i) => listRow(p, i + 1, per.get(p.stt).ai, "ai"))).join("")}</div></section>
      <section class="card"><h2>Tiến độ giám khảo <small>số SP đã xác nhận</small></h2><div class="body">${jpHtml}</div></section>
    </div>
    <section class="card"><h2>Góp ý mới nhất <a class="small" href="#gop-y" style="font-weight:700">Xem tất cả →</a></h2><div class="body thread">${CALC.cms.slice(0, 6).map(c => cmItem(c, true)).join("") || `<div class="empty">Chưa có góp ý. Góp ý được gắn vào từng tiêu chí trong trang chấm.</div>`}</div></section>
  </div>`;
}

/* ---------- Danh sách chấm ---------- */
function vTable() {
  const per = CALC.per; const f = S.f; const ft = fold(f.text);
  let rows = P.map(p => ({ p, r: per.get(p.stt), m: matchInfo(p) })).filter(x => x.m.ok);
  if (ft) rows = rows.filter(x => fold(x.p.name + " " + x.p.company).includes(ft));
  if (f.grade) rows = rows.filter(x => grade(x.r.mine) === f.grade);
  const counts = { all: rows.length, todo: 0, doing: 0, done: 0, cm: 0 };
  rows.forEach(x => { counts[status(x.p.stt)]++; if (CALC.cmCount.get(x.p.stt)) counts.cm++; });
  if (S.ttab === "cm") rows = rows.filter(x => CALC.cmCount.get(x.p.stt)); else if (S.ttab !== "all") rows = rows.filter(x => status(x.p.stt) === S.ttab);
  const k = S.sort.key, d = S.sort.dir;
  const val = x => k === "stt" ? x.p.stt : k === "name" ? fold(x.p.name) : k === "ai" ? x.r.ai : k === "mine" ? x.r.mine : k === "avg" ? (x.r.avg == null ? -1 : x.r.avg) : k === "cm" ? (CALC.cmCount.get(x.p.stt) || 0) : k === "st" ? ({ todo: 0, doing: 1, done: 2 })[status(x.p.stt)] : k.startsWith("c") ? eff(S.mine, x.p, +k.slice(1)) : 0;
  rows.sort((a, b) => { const va = val(a), vb = val(b); return (va < vb ? -1 : va > vb ? 1 : 0) * d || a.p.stt - b.p.stt; });
  const th = (key, label, cls = "", title = "") => `<th class="sortable ${cls}" data-act="sort" data-k="${key}" title="${esc(title || "Sắp xếp")}" aria-sort="${S.sort.key === key ? (S.sort.dir > 0 ? "ascending" : "descending") : "none"}">${label}<span class="ar">${S.sort.key === key ? (S.sort.dir > 0 ? "▲" : "▼") : "↕"}</span></th>`;
  const tcTh = S.showTC ? C.map((c, i) => th("c" + i, "TC" + c.tt, "c", c.name + " (tối đa " + c.max + ")")).join("") : "";
  const body = rows.map(({ p, r, m }) => {
    const tc = S.showTC ? C.map((c, i) => { const mv = eff(S.mine, p, i), a = p.ai.s[i]; return `<td class="c num"><span class="sc ${mv !== a ? "chg" : ""}"><b>${mv}</b>${mv !== a ? `<s>${a}</s>` : ""}</span></td>`; }).join("") : "";
    const cm = CALC.cmCount.get(p.stt) || 0;
    return `<tr data-act="open" data-stt="${p.stt}">
      <td class="num mut" style="font-weight:700">${p.stt}</td>
      <td style="min-width:260px"><div class="nm">${hl(p.name)}</div><div class="co">${hl(p.company)}</div>${m.where.length ? `<div class="hit">Khớp ở: ${m.where.slice(0, 5).map(esc).join(", ")}${m.where.length > 5 ? "…" : ""}</div>` : ""}</td>
      <td class="c">${spill(p.stt)}</td>${tc}
      <td class="c num"><span class="tot ai">${r.ai}</span></td>
      <td class="c num"><span class="tot gk">${r.mine}</span>${r.mine !== r.ai ? `<div class="small mut">${r.mine > r.ai ? "+" : ""}${r.mine - r.ai}</div>` : ""}</td>
      <td class="c num">${r.n ? `<span class="tot">${fmt1(r.avg)}</span><div class="small mut">${r.n} GK</div>` : `<span class="mut">—</span>`}</td>
      <td class="c">${gpill(r.mine)}</td>
      <td class="c num">${cm ? `<span class="pill g-k">${cm}</span>` : `<span class="mut">0</span>`}</td>
      <td><a class="go" href="#sp-${p.stt}">${status(p.stt) === "done" ? "Xem" : "Chấm"} →</a></td></tr>`;
  }).join("");
  const nx = nextTodo(0); const pct = Math.round(CALC.done / N * 100);
  const tabs = [["all", "Tất cả"], ["todo", "Chưa chấm"], ["doing", "Đang chấm"], ["done", "Đã chấm"], ["cm", "Có góp ý"]];
  const gradeOpts = ["", ...D.grades.map(g => g[1])].map(g => `<option value="${esc(g)}" ${f.grade === g ? "selected" : ""}>${g ? "Xếp loại: " + g : "Mọi xếp loại"}</option>`).join("");
  return `<div class="wrap">
    <div class="pagehead"><div><h1>Chấm điểm</h1><p>Bấm vào một sản phẩm để mở phiếu chấm. Điểm "Của tôi" mặc định bằng điểm AI cho tới khi bạn sửa.</p></div>
      <div class="row-flex">${nx ? `<a class="btn pri" href="#sp-${nx.stt}">Chấm sản phẩm chưa chấm tiếp theo →</a>` : ""}</div></div>
    ${banner()}
    <section class="card" style="padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center"><b class="num" style="font-family:var(--f-disp);font-size:20px;color:var(--ink)">${CALC.done}/${N}</b><div class="bar"><i style="width:${pct}%"></i></div><span class="small mut">đã xác nhận (${pct}%)</span></section>
    <div class="toolbar">
      <div class="tabs" role="tablist" style="border-bottom:0">${tabs.map(([k2, l]) => `<button role="tab" aria-selected="${S.ttab === k2}" class="${S.ttab === k2 ? "on" : ""}" data-act="ttab" data-v="${k2}">${l}<span class="n">${counts[k2]}</span></button>`).join("")}</div>
      <div class="left"><input class="inp" style="width:240px" type="text" id="f-text" data-f="text" placeholder="Lọc theo tên SP, doanh nghiệp" value="${esc(f.text)}" aria-label="Lọc theo tên"><select class="inp" style="width:auto" id="f-grade" data-f="grade" aria-label="Xếp loại">${gradeOpts}</select><label class="chk"><input type="checkbox" id="f-tc" data-act="tc" ${S.showTC ? "checked" : ""}> Hiện 9 tiêu chí</label></div>
    </div>
    <div class="tbl-wrap card"><table class="t">
      <thead><tr>${th("stt", "STT")}${th("name", "Sản phẩm / Doanh nghiệp")}${th("st", "Trạng thái", "c")}${tcTh}${th("ai", "AI", "c", "Tổng điểm AI")}${th("mine", "Của tôi", "c", "Tổng điểm của tôi")}${th("avg", "Hội đồng", "c", "Trung bình các giám khảo đã chấm")}<th class="c">Xếp loại</th>${th("cm", "Góp ý", "c")}<th></th></tr></thead>
      <tbody>${body || `<tr><td colspan="${9 + (S.showTC ? 9 : 0)}" class="empty" style="text-align:center;padding:28px">Không có sản phẩm nào khớp. Thử chọn tab "Tất cả" hoặc bỏ bớt bộ lọc.</td></tr>`}</tbody>
    </table></div>
  </div>`;
}

/* ---------- Trang chấm 1 sản phẩm ---------- */
function critRow(p, c, i) {
  const stt = p.stt, tt = c.tt, a = p.ai.s[i], mine = own(S.mine, stt, tt);
  const dk = "sc-" + stt + "-" + tt; const shown = S.drafts[dk] != null && S.drafts[dk] !== "" ? +S.drafts[dk] : (mine == null ? a : mine);
  const chg = mine != null && mine !== a; const dis = S.canWrite ? "" : "disabled";
  const r = CALC.per.get(stt); const avg = r.crit[i];
  const others = CALC.ids.filter(id => id !== S.myId && scored(CALC.J[id], stt));
  const bd = band(c, shown);
  let input;
  if (c.max <= 10) {
    input = `<div class="picker" role="radiogroup" aria-label="Điểm của tôi cho tiêu chí ${tt}">${Array.from({ length: c.max + 1 }, (_, v) => `<button role="radio" aria-checked="${v === shown}" class="${v === shown ? "on" : ""} ${v === a ? "ai" : ""}" data-act="pick" data-stt="${stt}" data-tt="${tt}" data-v="${v}" ${dis} title="${v === a ? "Điểm AI: " + v : v + " điểm"}">${v}</button>`).join("")}</div>`;
  } else {
    const pct = shown / c.max * 100;
    input = `<div class="slide"><button class="step" data-act="step" data-stt="${stt}" data-tt="${tt}" data-d="-1" aria-label="Giảm 1 điểm" ${dis}>−</button>
      <div class="rgw"><input class="rg" type="range" id="rg-${stt}-${tt}" min="0" max="${c.max}" step="1" value="${shown}" style="--p:${pct}%" data-range="${stt}:${tt}" aria-label="Điểm của tôi cho tiêu chí ${tt}" ${dis}><span class="ai-tick" style="left:calc(12px + (100% - 24px) * ${a / c.max})" title="Điểm AI: ${a}"></span></div>
      <button class="step" data-act="step" data-stt="${stt}" data-tt="${tt}" data-d="1" aria-label="Tăng 1 điểm" ${dis}>+</button>
      <input type="number" id="${dk}" inputmode="numeric" min="0" max="${c.max}" step="1" value="${shown}" data-score="${stt}:${tt}" aria-label="Nhập điểm tiêu chí ${tt}" ${S.canWrite ? "" : "readonly"}></div>`;
  }
  const rk = stt + "-" + tt; const open = S.openR[rk] || hasHit(p.ai.r[i]);
  const th = CALC.cms.filter(x => x.stt === stt && x.tt === tt).slice().reverse();
  const cmOpen = S.openCm[rk];
  return `<div class="crit ${chg ? "chg" : ""}" id="crit-${tt}">
    <div class="c-top"><span class="no">${tt}</span><div class="c-name">${esc(c.name)}<small>Tối đa ${c.max} điểm${avg != null ? ` · TB hội đồng ${fmt1(avg)}` : ""}</small></div>
      <div class="c-score">${S.canWrite && chg ? `<button class="aiv" data-act="reset" data-stt="${stt}" data-tt="${tt}" title="Bấm để quay về điểm AI">AI ${a} ↺</button>` : `<span class="aiv">AI ${a}</span>`}<span class="mv num" id="mv-${stt}-${tt}">${shown}</span><span class="of">/${c.max}</span></div></div>
    ${input}
    ${bd ? `<div class="band" id="bd-${stt}-${tt}"><span>Mức tham chiếu:</span><b>${bd[0] === bd[1] ? bd[0] : bd[0] + "–" + bd[1]}</b><span>${esc(bd[2])}</span></div>` : ""}
    <div class="reason"><span class="lb">Lý do AI chấm ${a}/${c.max}</span><div class="txt ${open ? "" : "clamp"}">${rich(p.ai.r[i])}</div><button class="linkbtn" data-act="toggleR" data-k="${rk}">${open ? "Thu gọn" : "Xem đầy đủ"}</button></div>
    <div class="c-foot">

  main.classList.toggle("has-mbar", r.startsWith("sp-"));
  document.querySelectorAll("#side a").forEach(a => { const on = a.dataset.r === (r.startsWith("sp-") ? "bang-diem" : r); a.classList.toggle("on", on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { } } }
  const marks = main.querySelectorAll("mark").length;
  $("#qcnt").textContent = S.terms.length ? (marks ? marks + " chỗ khớp" : "không khớp") : "";
  $("#qnext").hidden = !(S.terms.length && marks && S.hlOn);
  const todo = N - CALC.done; const bd = $("#todo-badge"); bd.hidden = !S.canWrite || !todo; bd.textContent = todo;
  $("#side-prog").innerHTML = S.mode === "local" ? "" : `Bạn đã chấm <b>${CALC.done}/${N}</b><div class="bar sm" style="margin-top:6px"><i style="width:${CALC.done / N * 100}%"></i></div>`;
  renderMe();
}
function renderMe() {
  const el = $("#me"); if (S.mode === "local" || !S.user) { el.innerHTML = ""; return; }
  el.innerHTML = `${S.meAvatar ? `<img src="${esc(S.meAvatar)}" alt="">` : ""}<span class="nm">${esc(S.meName || "Bạn")}<small>${S.canWrite ? "Giám khảo" : "Chỉ xem"}</small></span>`;
}
function setSync(kind, text) { const el = $("#sync"); el.className = "sync " + kind; el.querySelector("span").textContent = text; }
let markIx = -1;
function nextMark() { const ms = main.querySelectorAll("mark"); if (!ms.length) return; markIx = (markIx + 1) % ms.length; ms[markIx].scrollIntoView({ block: "center", behavior: "smooth" }); ms.forEach((m, i) => m.style.outline = i === markIx ? "2px solid var(--gk)" : ""); }

/* ---------- writes ---------- */
let saveT = null, saving = false, dirty = false, retried = false;
function touch(immediate) {
  if (!S.canWrite || !S.mine) return;
  S.mine.updatedAt = new Date().toISOString(); dirty = true; setSync("saving", "Đang lưu…");
  clearTimeout(saveT); saveT = setTimeout(flush, immediate ? 0 : 500);
  render();
}
async function flush() {
  if (saving) return; if (!dirty || !S.db || !S.myId) return;
  saving = true; dirty = false;
  const body = JSON.parse(JSON.stringify(S.mine));
  try {
    await S.db.doc("judges/" + S.myId).set(body); retried = false;
    if (!dirty) { S.savedAt = new Date(); setSync("ok", "Đã lưu"); const st = main.querySelector(".status .mut"); if (st) st.textContent = "Đã lưu lúc " + fmtHM(S.savedAt); }
  } catch (e) {
    const code = e && e.code;
    if (code === "invalid_argument") { S.canWrite = false; setSync("err", "Chỉ xem"); toast("Không lưu được: tài khoản này chưa có quyền chấm."); render(); }
    else if (code === "unavailable" && !retried) { retried = true; dirty = true; saving = false; setTimeout(flush, 1200 + Math.random() * 1200); return; }
    else if (code === "quota_exceeded") { setSync("err", "Hết dung lượng"); toast("Kho dữ liệu đã đầy, không lưu thêm được."); }
    else { dirty = true; setSync("err", "Lỗi lưu"); toast("Chưa lưu được (" + (code || "lỗi mạng") + "). Thao tác tiếp theo sẽ thử lưu lại."); }
  }
  saving = false;
  if (dirty) { clearTimeout(saveT); saveT = setTimeout(flush, 600); }
}
function setScore(stt, tt, v) {
  const c = C[tt - 1];
  if (v === null) { if (S.mine.scores[stt]) S.mine.scores[stt][tt] = null; }
  else { v = Math.max(0, Math.min(c.max, Math.round(v))); if (isNaN(v)) return; S.mine.scores[stt] = S.mine.scores[stt] || {}; S.mine.scores[stt][tt] = v; }
  delete S.drafts["sc-" + stt + "-" + tt];
  touch(false);
}
function liveRange(el) { // cập nhật số hiển thị khi kéo, chưa ghi
  const [stt, tt] = el.dataset.range.split(":").map(Number); const c = C[tt - 1]; const v = +el.value;
  el.style.setProperty("--p", (v / c.max * 100) + "%"); S.drafts["sc-" + stt + "-" + tt] = String(v);
  const num = document.getElementById("sc-" + stt + "-" + tt); if (num) num.value = v;
  const mv = document.getElementById("mv-" + stt + "-" + tt); if (mv) mv.textContent = v;
  const bd = band(c, v), be = document.getElementById("bd-" + stt + "-" + tt);
  if (bd && be) be.innerHTML = `<span>Mức tham chiếu:</span><b>${bd[0] === bd[1] ? bd[0] : bd[0] + "–" + bd[1]}</b><span>${esc(bd[2])}</span>`;
}
function goNextTodo(stt) {
  const nx = nextTodo(stt);
  if (nx) location.hash = "sp-" + nx.stt; else { toast("Bạn đã chấm xong cả " + N + " sản phẩm!"); location.hash = "bang-diem"; }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "open") { if (e.target.closest("a")) return; location.hash = "sp-" + t.dataset.stt; return; }
  if (a === "sort") { const k = t.dataset.k; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (k === "stt" || k === "name" ? 1 : -1) }; render(); return; }
  if (a === "basis") { S.basis = t.dataset.v; render(); return; }
  if (a === "ttab") { S.ttab = t.dataset.v; render(); return; }
  if (a === "tc") { S.showTC = t.checked; render(); return; }
  if (a === "tab") { S.tab = t.dataset.v; render(); return; }
  if (a === "toggleR") { S.openR[t.dataset.k] = !S.openR[t.dataset.k]; render(); return; }
  if (a === "toggleCm") { S.openCm[t.dataset.k] = !S.openCm[t.dataset.k]; render(); if (S.openCm[t.dataset.k]) { const ta = document.getElementById("cm-" + t.dataset.k); if (ta) ta.focus(); } return; }
  if (a === "exp") { doExport(t.dataset.v); return; }
  if (!S.canWrite || !S.mine) return;
  const stt = +t.dataset.stt, tt = +t.dataset.tt; const p = byStt.get(stt);
  if (a === "pick") setScore(stt, tt, +t.dataset.v);
  else if (a === "step") { const cur = S.drafts["sc-" + stt + "-" + tt] != null ? +S.drafts["sc-" + stt + "-" + tt] : (own(S.mine, stt, tt) == null ? p.ai.s[tt - 1] : own(S.mine, stt, tt)); setScore(stt, tt, cur + (+t.dataset.d)); }
  else if (a === "reset") setScore(stt, tt, null);
  else if (a === "allai") { S.mine.scores[stt] = {}; C.forEach(c => delete S.drafts["sc-" + stt + "-" + c.tt]); touch(true); toast("Đã đặt lại 9 tiêu chí theo điểm AI"); }
  else if (a === "confirm" || a === "confirmnext") { S.mine.confirmed[stt] = true; touch(true); toast("Đã xác nhận điểm sản phẩm " + stt + ": " + jTotal(S.mine, p) + "/100"); if (a === "confirmnext") goNextTodo(stt); }
  else if (a === "unconfirm") { delete S.mine.confirmed[stt]; touch(true); toast("Đã bỏ xác nhận sản phẩm " + stt); }
  else if (a === "addcm") {
    const id = "cm-" + stt + "-" + tt; const el = document.getElementById(id); const text = (el ? el.value : "").trim();
    if (!text) { toast("Nhập nội dung góp ý trước khi gửi."); return; }
    S.mine.comments.push({ id: uid(), stt, tt, text: text.slice(0, 4000), at: new Date().toISOString() });
    delete S.drafts[id]; touch(true); toast("Đã gửi góp ý");
  }
  else if (a === "delcm") { S.mine.comments = S.mine.comments.filter(c => c.id !== t.dataset.id); touch(true); toast("Đã xóa góp ý"); }
  else if (a === "savenote") { const el = document.getElementById("note-" + stt); S.mine.notes[stt] = (el ? el.value : "").slice(0, 4000); delete S.drafts["note-" + stt]; touch(true); toast("Đã lưu ghi chú"); }
});
let fT;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.range) { liveRange(t); return; }
  if (t.id && (t.id.startsWith("cm-") || t.id.startsWith("note-") || t.id.startsWith("sc-"))) S.drafts[t.id] = t.value;
  if (t.dataset.f === "text") { S.f.text = t.value; clearTimeout(fT); fT = setTimeout(render, 200); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.range) { S.dragging = false; const [stt, tt] = t.dataset.range.split(":").map(Number); if (S.canWrite) setScore(stt, tt, +t.value); return; }
  if (t.dataset.score) { const [stt, tt] = t.dataset.score.split(":").map(Number); if (!S.canWrite) return; setScore(stt, tt, t.value === "" ? null : Number(t.value)); return; }
  if (t.dataset.f && t.dataset.f !== "text") { S.f[t.dataset.f] = t.value; render(); return; }
  if (t.id === "cm-filter") { S.cmFilter = t.value; render(); }
});
document.addEventListener("pointerdown", e => { if (e.target.classList && e.target.classList.contains("rg")) S.dragging = true; });
document.addEventListener("pointerup", () => { if (S.dragging) { S.dragging = false; if (S.pendingRender) { S.pendingRender = false; setTimeout(render, 0); } } });
document.addEventListener("keydown", e => {
  const tg = e.target; const typing = tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable);
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && tg.id && tg.id.startsWith("cm-")) { const [, stt, tt] = tg.id.split("-"); const b = document.querySelector(`[data-act="addcm"][data-stt="${stt}"][data-tt="${tt}"]`); if (b) b.click(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); return; }
  if (S.route.startsWith("sp-")) {
    const stt = +S.route.slice(3); const i = P.findIndex(p => p.stt === stt);
    if (e.key === "ArrowLeft") { location.hash = "sp-" + P[(i - 1 + N) % N].stt; }
    else if (e.key === "ArrowRight") { location.hash = "sp-" + P[(i + 1) % N].stt; }
    else if (e.key === "n" || e.key === "N") { const nx = nextTodo(stt); if (nx) location.hash = "sp-" + nx.stt; }
  }
});
let qT;
$("#q").addEventListener("input", e => {
  clearTimeout(qT); qT = setTimeout(() => {
    S.q = e.target.value; S.terms = fold(S.q).split(/\s+/).filter(t => t.length >= 2); markIx = -1;
    if (S.terms.length && ["tong-quan", "tieu-chi", "xuat-du-lieu", "xep-hang"].includes(S.route)) location.hash = "bang-diem"; else render();
  }, 180);
});
$("#hl").addEventListener("change", e => { S.hlOn = e.target.checked; render(); });
$("#qnext").addEventListener("click", nextMark);
window.addEventListener("hashchange", () => { const prev = S.route; S.route = parseRoute(); markIx = -1; if (prev !== S.route) { S.openCm = {}; } render(); window.scrollTo(0, 0); });

/* ---------- export ---------- */
function rowsSummary() {
  const head = ["STT", "ID", "Tên sản phẩm", "Doanh nghiệp", ...C.map(c => "AI TC" + c.tt + " (/" + c.max + ")"), "Tổng AI", ...C.map(c => "Của tôi TC" + c.tt), "Tổng của tôi", "Tôi đã xác nhận", ...C.map(c => "TB GK TC" + c.tt), "TB tổng GK", "Số GK đã chấm", "Xếp loại (của tôi)", "Độ tin cậy bằng chứng (AI)", "Số góp ý", "Nhận xét AI"];
  const rows = P.map(p => { const r = CALC.per.get(p.stt); return [p.stt, p.id, p.name, p.company, ...p.ai.s, r.ai, ...C.map((c, i) => eff(S.mine, p, i)), r.mine, isDone(p.stt) ? "x" : "", ...r.crit.map(v => v == null ? "" : Math.round(v * 10) / 10), r.avg == null ? "" : Math.round(r.avg * 10) / 10, r.n, grade(r.mine), p.ai.conf, CALC.cmCount.get(p.stt) || 0, p.ai.summary]; });
  return [head, ...rows];
}
function csvOf(aoa) { return "﻿" + aoa.map(r => r.map(v => { const s = String(v == null ? "" : v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); }
function loadXLSX() { return new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX); const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function save(filename, data) {
  if (!S.dl) { toast("Chế độ xem này không tải file được."); return; }
  try { await S.dl.save({ filename, data }); toast("Đã tải " + filename); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Đang có một hộp thoại tải file, thử lại sau giây lát." : "Không tải được file (" + ((e && e.code) || "lỗi") + ")."); }
}
async function doExport(kind) {
  compute(); const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "csv") return save("MIV2026_bang_diem_" + stamp + ".csv", csvOf(rowsSummary()));
  if (kind === "copy") { const txt = rowsSummary().map(r => r.map(v => String(v == null ? "" : v).replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n"); try { await navigator.clipboard.writeText(txt); toast("Đã sao chép, dán vào Excel/Google Sheets."); } catch (e) { toast("Trình duyệt chặn sao chép."); } return; }
  const names = {}; for (const id of CALC.ids) names[id] = person(id).name;
  if (kind === "json") return save("MIV2026_sao_luu_" + stamp + ".json", JSON.stringify({ exportedAt: new Date().toISOString(), criteria: C, products: P, judges: Object.fromEntries(CALC.ids.map(id => [names[id], CALC.J[id]])) }, null, 1));
  if (kind === "xlsx") {
    let X; try { X = await loadXLSX(); } catch (e) { toast("Không tải được thư viện Excel. Dùng CSV thay thế."); return; }
    const wb = X.utils.book_new();
    const s1 = X.utils.aoa_to_sheet(rowsSummary()); s1["!cols"] = [{ wch: 5 }, { wch: 7 }, { wch: 40 }, { wch: 32 }]; X.utils.book_append_sheet(wb, s1, "Tổng hợp");
    const r2 = [["STT", "Tên sản phẩm", "TT", "Tiêu chí", "Tối đa", "Điểm AI", "Điểm của tôi", "TB GK", "Lý do AI chấm"]];
    P.forEach(p => C.forEach((c, i) => { const cv = CALC.per.get(p.stt).crit[i]; r2.push([p.stt, p.name, c.tt, c.name, c.max, p.ai.s[i], eff(S.mine, p, i), cv == null ? "" : Math.round(cv * 10) / 10, p.ai.r[i]]); }));
    const s2 = X.utils.aoa_to_sheet(r2); s2["!cols"] = [{ wch: 5 }, { wch: 34 }, { wch: 4 }, { wch: 36 }, { wch: 6 }, { wch: 7 }, { wch: 8 }, { wch: 7 }, { wch: 120 }]; X.utils.book_append_sheet(wb, s2, "Lý do AI");
    const r3 = [["Giám khảo", "STT", "Tên sản phẩm", ...C.map(c => "TC" + c.tt), "Tổng", "Đã xác nhận", "Ghi chú", "Cập nhật"]];
    CALC.ids.forEach(id => { const d = CALC.J[id]; P.forEach(p => { if (scored(d, p.stt)) r3.push([names[id], p.stt, p.name, ...C.map((c, i) => eff(d, p, i)), jTotal(d, p), d.confirmed && d.confirmed[p.stt] ? "x" : "", (d.notes || {})[p.stt] || "", d.updatedAt || ""]); }); });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(r3), "Điểm từng GK");
    const r4 = [["Thời gian", "Giám khảo", "STT", "Tên sản phẩm", "Tiêu chí", "Nội dung"]];
    CALC.cms.slice().reverse().forEach(c => r4.push([fmtT(c.at), names[c.by] || "", c.stt, byStt.get(c.stt).name, c.tt ? "TC" + c.tt + ". " + C[c.tt - 1].short : "Góp ý chung", c.text]));
    const s4 = X.utils.aoa_to_sheet(r4); s4["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 5 }, { wch: 34 }, { wch: 22 }, { wch: 100 }]; X.utils.book_append_sheet(wb, s4, "Góp ý");
    return save("MIV2026_cham_diem_" + stamp + ".xlsx", new Blob([X.write(wb, { bookType: "xlsx", type: "array" })]));
  }
}

/* ---------- runtime ---------- */
async function boot() {
  S.route = parseRoute(); render();
  if (!window.claude || typeof window.claude.use !== "function") { S.mode = "local"; setSync("", "Bản xem tĩnh"); render(); return; }
  setSync("", "Đang kết nối…");
  let user = null, db = null, dl = null;
  try { [user, db, dl] = await Promise.all([window.claude.use("user"), window.claude.use("db"), window.claude.use("downloads")]); } catch (e) { }
  S.user = user; S.dl = dl;
  if (user) { const me = await user.me(); S.myId = me.id; S.meName = me.name; S.meAvatar = me.avatarUrl; }
  if (!db) { S.mode = "local"; setSync("", "Chỉ xem"); render(); return; }
  S.db = db; S.mode = "live";
  let can = null; try { can = user ? await user.can("data.write") : null; } catch (e) { }
  const writable = !!S.myId && can !== false;
  const timer = setTimeout(() => { if (!S.dbReady) { S.mode = "stale"; setSync("err", "Chưa kết nối"); render(); } }, 10000);
  db.collection("judges").onSnapshot(snap => {
    const j = {}; snap.docs.forEach(d => { if (d.exists) j[d.id] = d.data(); }); S.judges = j;
    if (!snap.metadata.fromCache && !S.dbReady) { clearTimeout(timer); S.dbReady = true; S.mode = "live"; S.canWrite = writable; setSync(S.canWrite ? "ok" : "", S.canWrite ? "Đã đồng bộ" : "Chỉ xem"); }
    if (!dirty && !saving) S.mine = S.myId ? JSON.parse(JSON.stringify(j[S.myId] || emptyDoc())) : null;
    if (S.mine) { S.mine.scores = S.mine.scores || {}; S.mine.notes = S.mine.notes || {}; S.mine.confirmed = S.mine.confirmed || {}; S.mine.comments = S.mine.comments || []; }
    render(); refreshProfiles();
  }, err => { clearTimeout(timer); S.mode = "stale"; S.canWrite = false; setSync("err", err && err.code === "revoked" ? "Mất quyền truy cập" : "Mất kết nối"); render(); });
}
boot();
})();
</script>
