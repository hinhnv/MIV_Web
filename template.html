<title>Phòng chấm MIV 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Bố cục: thanh tiêu đề (dính) + thanh điều hướng ngang; nội dung rộng tối đa --maxw.
   Trang chấm: thẻ sản phẩm ở trên; phiếu chấm (trái, có dải 9 tiêu chí dính) | tổng điểm + hồ sơ (phải, dính).
   Mã màu cố định: xanh dương = điều hướng/hành động · tím = AI · cam = điểm của bạn · xanh ngọc = hội đồng
   · xanh lá = đã chấm/xác nhận · hổ phách = đang chấm. Một giao diện sáng duy nhất. */
:root{
  color-scheme:light;
  --bg:#eef2f8; --panel:#ffffff; --panel2:#f5f7fb; --line:#d3dce9; --line2:#e6ebf3;
  --fg:#0f172a; --ink:#0f1f3d; --muted:#475569; --faint:#64748b;
  --brand:#2563eb; --brand-hover:#1d4ed8; --brand-ink:#1e40af; --brand-fill:#3b82f6; --brand-soft:#dbe8ff; --brand-soft2:#eff5ff; --brand-line:#93b8fb;
  --ai:#6d28d9; --ai-fill:#8b5cf6; --ai-soft:#f3edff; --ai-line:#c9b6fd;
  --gk:#c2410c; --gk-fill:#f97316; --gk-soft:#fff2e6; --gk-line:#fdb27a;
  --hd:#0f766e; --hd-fill:#14b8a6; --hd-soft:#dcf8f1; --hd-line:#7ee0cf;
  --good:#15803d; --good-fill:#22c55e; --good-soft:#dcfce7; --good-line:#86efac;
  --warn:#b45309; --warn-fill:#f59e0b; --warn-soft:#fef3c7; --warn-line:#fcd34d;
  --bad:#b91c1c; --bad-soft:#fee2e2; --bad-line:#fca5a5;
  --sky:#0369a1; --sky-soft:#e0f2fe;
  --mark:#fde047; --mark-fg:#0f172a;
  --hdr:#ffffff; --hdr-fg:#0f1f3d; --hdr-muted:#475569;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 3px 10px rgba(15,23,42,.05);
  --shadow-lg:0 12px 32px rgba(15,23,42,.16);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Plus Jakarta Sans","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --hdr-h:68px; --r:12px; --maxw:1520px;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand-fill);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:var(--mark-fg);border-radius:3px;padding:0 2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;color:var(--ink);letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.t-ai{color:var(--ai)}.t-gk{color:var(--gk)}.t-hd{color:var(--hd)}.t-ok{color:var(--good)}

/* ---------- thanh tiêu đề ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:3px;background:linear-gradient(90deg,var(--brand) 0%,var(--ai-fill) 50%,var(--gk-fill) 100%)}
.top-in{max-width:var(--maxw);margin:0 auto;min-height:calc(var(--hdr-h) - 4px);display:flex;align-items:center;gap:16px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none;margin-right:auto}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:13px;letter-spacing:.03em;flex:none;box-shadow:0 2px 8px rgba(37,99,235,.35)}
.bt b{display:block;font-family:var(--f-disp);font-size:17px;font-weight:800;color:var(--ink);line-height:1.15}
.bt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.25}
.search{flex:1 1 360px;max-width:580px;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:4px 8px 4px 12px}
.search:focus-within{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.search svg{flex:none;color:var(--brand)}
.search input[type=search]{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:7px 0}
.search input::placeholder{color:var(--faint)}
.search .cnt{font-size:12.5px;color:var(--brand-ink);font-weight:600;white-space:nowrap}
.search label{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.iconbtn{background:#fff;border:1px solid var(--line);color:var(--brand-ink);padding:2px 8px;border-radius:7px;font-size:13px;font-weight:700}
.who{display:flex;align-items:center;gap:12px}
.sync{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.ok{color:var(--good);background:var(--good-soft);border-color:var(--good-line)}.sync.ok i{background:var(--good-fill)}
.sync.saving{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}.sync.saving i{background:var(--warn-fill)}
.sync.err{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-line)}.sync.err i{background:var(--bad)}
.me{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.me img{width:32px;height:32px;border-radius:50%;background:var(--brand-soft)}
.me small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}

/* ---------- thanh điều hướng ngang ---------- */
.nav{background:var(--panel);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:16px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.navtabs{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtabs a{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14.5px;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s,background .15s}
.navtabs a:hover{color:var(--brand-ink);background:var(--brand-soft2)}
.navtabs a.on{color:var(--brand);border-bottom-color:var(--brand);background:linear-gradient(to top,var(--brand-soft2),transparent)}
.navtabs a svg{flex:none}
.navtabs .badge{font-size:11.5px;font-weight:700;background:var(--gk);color:#fff;padding:0 7px;border-radius:999px;line-height:19px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap;flex:none}
.prog b{color:var(--good);font-size:14.5px}
.prog .bar{width:150px}

/* ---------- khung trang ---------- */
main{min-width:0;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;gap:18px}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 16px 28px;font-size:12px;color:var(--faint);text-align:center}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none;font-weight:700}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.pagehead h1{font-size:26px}
.pagehead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.banner{padding:11px 14px;border-radius:10px;font-size:13.5px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn-line);border-left:5px solid var(--warn-fill)}
.banner b{color:var(--warn)}

/* ---------- thẻ ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card>h2{position:relative;font-size:15.5px;padding:14px 18px 14px 20px;border-bottom:1px solid var(--line2);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card>h2::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:0 4px 4px 0;background:var(--acc,var(--brand))}
.card>h2 small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--muted)}
.card.acc-ai{--acc:var(--ai-fill)}.card.acc-hd{--acc:var(--hd-fill)}.card.acc-gk{--acc:var(--gk-fill)}.card.acc-ok{--acc:var(--good-fill)}.card.acc-warn{--acc:var(--warn-fill)}
.card .body{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.k-blue{--kc:var(--brand);--ks:var(--brand-soft)}.k-ai{--kc:var(--ai);--ks:var(--ai-soft)}.k-hd{--kc:var(--hd);--ks:var(--hd-soft)}
.k-sky{--kc:var(--sky);--ks:var(--sky-soft)}.k-warn{--kc:var(--warn);--ks:var(--warn-soft)}.k-ok{--kc:var(--good);--ks:var(--good-soft)}.k-slate{--kc:#334155;--ks:#e9eef5}
.ki{width:44px;height:44px;border-radius:12px;background:var(--ks);color:var(--kc);display:grid;place-items:center;flex:none}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--kc);border-radius:var(--r);padding:14px 16px;display:flex;gap:13px;align-items:center;box-shadow:var(--shadow);min-width:0}
.kpi>div{min-width:0}
.kpi .kl{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.kpi b{display:block;font-family:var(--f-disp);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--kc)}
.kpi em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,1fr);gap:28px;align-items:center;background:linear-gradient(120deg,#e6efff 0%,#ffffff 52%,#fff4ea 100%);border:1px solid var(--line);border-radius:16px;padding:24px 26px;box-shadow:var(--shadow)}
.hero-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-size:12.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.07em}
.hero h1{font-size:27px}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.hprog{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hprog b{font-family:var(--f-disp);font-size:24px;color:var(--good);line-height:1}
.hprog b small{font-size:14px;color:var(--muted)}
.hprog span{font-weight:700;color:var(--good)}
.hero-r{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.maphead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
.pmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.cell{height:34px;display:grid;place-items:center;border-radius:8px;font-size:12.5px;font-weight:700;text-decoration:none;border:1.5px solid var(--line);background:#fff;color:var(--muted);font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s}
.cell:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(15,23,42,.14);border-color:var(--brand)}
.cell.c-done{background:var(--good);border-color:var(--good);color:#fff}
.cell.c-doing{background:var(--warn-soft);border-color:var(--warn-fill);color:#92400e}
.cell.nx{outline:3px solid var(--brand-fill);outline-offset:1px}
.bar{height:12px;border-radius:99px;background:var(--line2);overflow:hidden;position:relative;display:block}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--brand-fill)}
.bar.good i{background:linear-gradient(90deg,var(--good-fill),#16a34a)}.bar.gk i{background:var(--gk-fill)}.bar.ai i{background:var(--ai-fill)}.bar.hd i{background:var(--hd-fill)}
.bar.sm{height:8px}

/* ---------- nhãn & nút ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid transparent;line-height:1.35}
.pill.lg{font-size:14px;padding:10px 16px}
.g-xs{background:#15803d;color:#fff}.g-t{background:var(--good-soft);color:#166534;border-color:var(--good-line)}.g-k{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.g-tb{background:var(--warn-soft);color:#92400e;border-color:var(--warn-line)}.g-y{background:var(--bad-soft);color:#991b1b;border-color:var(--bad-line)}
.c-cao{background:var(--good-soft);color:#166534;border-color:var(--good-line)}.c-tb{background:var(--panel2);color:var(--muted);border-color:var(--line)}.c-thap{background:var(--bad-soft);color:#991b1b;border-color:var(--bad-line)}
.st-done{background:var(--good);color:#fff}.st-doing{background:var(--warn-soft);color:#92400e;border-color:var(--warn-fill)}.st-todo{background:#fff;color:var(--muted);border-color:#c3cddb}
.chgp{background:var(--gk);color:#fff}
.cmn{background:var(--sky-soft);color:var(--sky);border-color:#9fd3f5}
/* phân công */
.p-excl{background:var(--bad-soft);color:#991b1b;border-color:var(--bad-line)}
.p-grp{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.p-grp.g1{background:#e0f2fe;color:#075985;border-color:#7dd3fc}.p-grp.g2{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.p-grp.g3{background:#dcfce7;color:#166534;border-color:#86efac}.p-grp.g4{background:#fce7f3;color:#9d174d;border-color:#f9a8d4}.p-grp.g5{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.p-multi{background:#fef9c3;color:#854d0e;border-color:#facc15}
.p-verify{background:#fff7ed;color:#c2410c;border-color:#fb923c}
.p-mine{background:var(--brand);color:#fff}
.chips-in{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.chips-in .pill{font-size:11px;padding:1px 8px}
.t tr.excl td{background:#fafafa}.t tr.excl .nm{color:var(--muted)}.t tr.excl .co{color:var(--faint)}
.note-x{display:flex;flex-direction:column;gap:3px;align-items:flex-start}.note-x small{font-size:11.5px;color:#991b1b;font-weight:600}
.cell.x{background:repeating-linear-gradient(135deg,#f8fafc 0 4px,#e2e8f0 4px 8px);color:#94a3b8;border-color:#e2e8f0;text-decoration:line-through}
.cell.dim{opacity:.45}
.asg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.asg h3{margin:10px 0 4px;font-size:15px;color:var(--ink)}
.asg.asg-me{box-shadow:0 0 0 2px var(--brand-fill),var(--shadow)}
.asg.asg-x{background:#fffafa}
.stt-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.stt-chips.inl{display:inline-flex;margin:0 0 0 6px;vertical-align:middle}
.sc-chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 7px;border-radius:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:12.5px;font-weight:700;text-decoration:none;font-variant-numeric:tabular-nums;position:relative}
.sc-chip:hover{border-color:var(--brand);color:var(--brand)}
.sc-chip.m{background:#fefce8;border-color:#facc15}
.sc-chip.v::after{content:"!";position:absolute;top:-6px;right:-5px;width:15px;height:15px;border-radius:50%;background:#f97316;color:#fff;font-size:10px;display:grid;place-items:center;font-weight:800}
.banner.b-excl{background:var(--bad-soft);border-color:var(--bad-line);border-left-color:var(--bad)}.banner.b-excl b{color:var(--bad)}
.banner.b-info{background:#fefce8;border-color:#fde68a;border-left-color:#facc15}.banner.b-info b{color:#854d0e}
.asg-me-line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.t-bad{color:var(--bad)}
.t select.cfg-sel{min-height:32px;height:32px;padding:3px 26px 3px 8px;font-size:13px;width:auto;max-width:170px}
.t select.cfg-sel.on{border-color:var(--brand-line);background-color:var(--brand-soft2);color:var(--brand-ink);font-weight:700}
.t select.cfg-sel.x{border-color:var(--bad-line);background-color:var(--bad-soft);color:#991b1b;font-weight:700}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:#fff;padding:9px 14px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);min-height:40px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:#fff}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 2px 8px rgba(21,128,61,.3)}
.btn.ok:hover{background:#166534;border-color:#166534;color:#fff}
.btn.soft{background:var(--brand-soft2);border-color:var(--brand-soft);color:var(--brand-ink)}
.btn.soft:hover{border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn.lg{padding:11px 18px;font-size:15px;min-height:46px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brand);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:11px 10px 9px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--brand-ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .n{font-size:11.5px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:0 6px;margin-left:5px}
.tabs button.on .n{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-ink)}
.ftabs{display:flex;gap:6px;flex-wrap:wrap}
.ftabs button{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px 6px 10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:background .15s,border-color .15s}
.ftabs button .d{width:9px;height:9px;border-radius:50%;background:var(--dc,var(--brand))}
.ftabs button .n{font-size:12px;background:var(--panel2);border-radius:999px;padding:0 7px;color:var(--ink)}
.ftabs button:hover{border-color:var(--dc,var(--brand))}
.ftabs button.on{background:var(--dc,var(--brand));border-color:var(--dc,var(--brand));color:#fff}
.ftabs button.on .d{background:#fff}
.ftabs button.on .n{background:rgba(255,255,255,.22);color:#fff}
.f-all{--dc:var(--brand)}.f-todo{--dc:#475569}.f-doing{--dc:var(--warn)}.f-done{--dc:var(--good)}.f-cm{--dc:var(--sky)}

/* ---------- bảng ---------- */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);font-size:14px}
.t th,.t td{border-bottom:1px solid var(--line2);padding:10px 10px;text-align:left;vertical-align:middle}
.t thead th{background:#eaf1fd;font-weight:800;color:var(--brand-ink);font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:1;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--brand-soft)}
.t thead th.sortable{cursor:pointer;user-select:none}
.t thead th.sortable:hover{color:var(--brand)}
.t thead th .ar{opacity:.5;font-size:10px;margin-left:3px}
.t tbody tr{cursor:pointer;transition:background .12s}
.t tbody tr:nth-child(even) td{background:#fafbfe}
.t tbody tr:hover td{background:var(--brand-soft2)}
.t td.c,.t th.c{text-align:center}
.t .nm{font-weight:700;color:var(--ink)}
.t .co{font-size:12.5px;color:var(--muted)}
.t .hit{font-size:12px;color:var(--brand-ink);margin-top:3px}
.no-b{display:inline-grid;place-items:center;min-width:32px;height:28px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-weight:800;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sc{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;min-width:24px}
.sc b{font-weight:700}
.sc s{font-size:10.5px;color:var(--faint)}
.sc.chg b{color:var(--gk)}
.tot{display:inline-block;min-width:46px;padding:3px 8px;border-radius:8px;font-family:var(--f-disp);font-weight:800;font-size:15px;text-align:center;background:var(--panel2);color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.35}
.tot.ai{background:var(--ai-soft);color:var(--ai)}.tot.gk{background:var(--gk-soft);color:var(--gk)}.tot.hd{background:var(--hd-soft);color:var(--hd)}
.tot.up{background:var(--good-soft);color:var(--good)}.tot.dn{background:var(--bad-soft);color:var(--bad)}
.tot.sm{font-size:13px;min-width:0;padding:1px 8px}
.dl{font-size:12px;font-weight:700;margin-top:2px}.dl.up{color:var(--good)}.dl.dn{color:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.toolbar .left{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp{width:100%;min-width:0;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.inp:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
.inp.sm{padding:5px 9px;font-size:13px;min-height:34px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer;font-weight:600}
.progcard{padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center}
.progcard>b{font-family:var(--f-disp);font-size:22px;color:var(--good)}
.progcard>b small{font-size:13px;color:var(--muted);font-weight:600}
.stchips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- biểu đồ & danh sách ---------- */
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;align-items:center}
.track{height:9px;background:var(--line2);border-radius:5px;position:relative;overflow:hidden}
.track i{position:absolute;inset:0 auto 0 0;border-radius:5px}
.track i.ai{background:var(--ai-fill)}.track i.gk{background:var(--gk-fill)}.track i.hd{background:var(--hd-fill)}.track i.br{background:var(--brand-fill)}.track i.ok{background:var(--good-fill)}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;font-family:var(--f-body);font-weight:600}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg-done{background:var(--good)}.lg-doing{background:var(--warn-soft);border:1.5px solid var(--warn-fill)}.lg-todo{background:#fff;border:1.5px solid #c3cddb}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .grid-l{stroke:var(--line2)}
svg.chart .b-ai{fill:var(--ai-fill)}svg.chart .b-hd{fill:var(--hd-fill)}
svg.chart .v{fill:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column}
.list .row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:9px;text-decoration:none;color:inherit}
.list .row:hover{background:var(--brand-soft2)}
.rk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-disp);font-weight:800;font-size:13px;color:var(--muted);background:var(--panel2);border:1px solid var(--line2)}
.rk.r1{background:#fef3c7;color:#92400e;border-color:#fcd34d}.rk.r2{background:#eef2f7;color:#334155;border-color:#cbd5e1}.rk.r3{background:#ffedd5;color:#9a3412;border-color:#fdba74}
.list .row .t1{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.list .row .t2{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- trang chấm ---------- */
.phead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 20px;border-top:4px solid var(--brand)}
.pno{width:66px;height:66px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.pno b{font-family:var(--f-disp);font-size:27px;font-weight:800}
.pno span{font-size:11.5px;margin-top:3px;font-weight:600;color:#dbe8ff}
.pinfo{min-width:0}
.pinfo h1{font-size:23px;line-height:1.25;margin:7px 0 5px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.meta a{font-weight:700;text-decoration:none}
.pnav{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pnav .row-flex{flex-wrap:nowrap}
.pnav select{width:auto;max-width:250px}
.work{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(360px,1fr);gap:18px;align-items:start}
.sheet>header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line2)}
.sheet>header h2{font-size:17px}
.cstrip{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top,0px));z-index:6;display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;align-items:center;padding:9px 16px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line2)}
.cs{flex:none;display:inline-flex;align-items:baseline;gap:2px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:3px 8px 3px 3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;transition:border-color .12s,background .12s}
.cs .n{align-self:center;display:inline-grid;place-items:center;width:21px;height:21px;border-radius:6px;background:var(--brand-soft);color:var(--brand-ink);font-weight:800;font-size:11.5px;margin-right:3px}
.cs b{font-family:var(--f-disp);font-size:15px;font-weight:800;color:var(--ink)}
.cs:hover{border-color:var(--brand)}
.cs.chg{border-color:var(--gk-line);background:var(--gk-soft)}
.cs.chg .n{background:var(--gk);color:#fff}
.cs.chg b{color:var(--gk)}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:10px 20px;background:var(--brand-soft2);border-bottom:1px solid var(--brand-soft);color:var(--brand-ink);font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.grp .gs{display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted)}
.crit{padding:18px 20px 18px 16px;border-left:4px solid transparent;border-bottom:1px solid var(--line2);display:flex;flex-direction:column;gap:12px;scroll-margin-top:calc(var(--hdr-h) + 72px)}
.crit:last-child{border-bottom:0;border-radius:0 0 0 var(--r)}
.crit.chg{border-left-color:var(--gk-fill);background:linear-gradient(90deg,var(--gk-soft),#fff 60%)}
.c-top{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start}
.c-top .no{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:15px;display:grid;place-items:center}
.crit.chg .c-top .no{background:var(--gk)}
.c-name{font-weight:700;color:var(--ink);line-height:1.35;font-size:15.5px}
.c-name small{display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:4px}
.c-score{display:flex;align-items:center;gap:8px;white-space:nowrap}
.aiv{font-size:12.5px;font-weight:800;color:var(--ai);background:var(--ai-soft);border:1.5px solid var(--ai-line);border-radius:999px;padding:3px 10px}
button.aiv:hover{background:#e9defe;border-color:var(--ai-fill)}
.mvbox{display:flex;align-items:baseline;gap:2px;background:var(--gk-soft);border:1.5px solid var(--gk-line);border-radius:11px;padding:3px 11px}
.mvbox .mv{font-family:var(--f-disp);font-size:26px;font-weight:800;color:var(--gk);line-height:1.1}
.mvbox .of{font-size:13px;color:var(--muted);font-weight:700}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{min-width:42px;height:42px;padding:0 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;color:var(--ink);position:relative;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s,color .12s}
.picker button:hover:not(:disabled){border-color:var(--gk-fill);background:var(--gk-soft);color:var(--gk)}
.picker button.ai{border-color:var(--ai-fill);border-style:dashed;color:var(--ai);background:var(--ai-soft)}
.picker button.ai::after{content:"AI";position:absolute;top:-8px;right:-6px;font-size:9.5px;font-weight:800;background:var(--ai);color:#fff;border-radius:5px;padding:0 4px;line-height:15px}
.picker button.on,.picker button.on:hover:not(:disabled){background:var(--gk);border-color:var(--gk);color:#fff;border-style:solid;box-shadow:0 2px 8px rgba(194,65,12,.32)}
.picker button:disabled{cursor:not-allowed;opacity:.6}
.slide{display:grid;grid-template-columns:42px minmax(0,1fr) 42px 66px;gap:8px;align-items:center}
.slide .step{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--gk-line);background:#fff;font-size:19px;font-weight:800;color:var(--gk)}
.slide .step:hover:not(:disabled){background:var(--gk-soft);border-color:var(--gk-fill)}
.slide input[type=number]{height:42px;border:1.5px solid var(--gk-line);border-radius:10px;text-align:center;font-family:var(--f-disp);font-weight:800;font-size:18px;color:var(--gk);background:var(--gk-soft);-moz-appearance:textfield;width:100%}
.slide input[type=number]:focus{outline:0;border-color:var(--gk-fill);box-shadow:0 0 0 3px #ffe1c7}
.slide input[type=number]::-webkit-inner-spin-button,.slide input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.rgw{position:relative;padding-top:6px;padding-bottom:14px}
.rg{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0;display:block}
.rg::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--gk-fill) 0 var(--p,0%),var(--line2) var(--p,0%) 100%);border:1px solid var(--line)}
.rg::-moz-range-track{height:10px;border-radius:99px;background:var(--line2)}
.rg::-moz-range-progress{height:10px;border-radius:99px;background:var(--gk-fill)}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--gk);margin-top:-8px;box-shadow:0 1px 5px rgba(0,0,0,.22)}
.rg::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;border:5px solid var(--gk)}
.rg:disabled{cursor:not-allowed;opacity:.6}
.ai-tick{position:absolute;top:4px;width:3px;height:26px;border-radius:2px;background:var(--ai);transform:translateX(-50%);pointer-events:none}
.ai-tick::after{content:"AI";position:absolute;top:27px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--ai)}
.band{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:6px 11px}
.band b{color:var(--gk);font-family:var(--f-disp)}
.reason{font-size:14px;line-height:1.65;background:var(--ai-soft);border:1px solid #e6dcfd;border-left:4px solid var(--ai-fill);border-radius:4px 10px 10px 4px;padding:11px 14px;color:var(--fg)}
.reason .lb{font-size:11.5px;font-weight:800;color:var(--ai);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.reason .txt.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:700;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.c-foot{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--hd-soft);border:1px solid var(--hd-line);display:inline-flex;gap:5px;align-items:center;color:var(--ink)}
.chip img{width:18px;height:18px;border-radius:50%}
.chip b{color:var(--hd)}
details.anch summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand)}
details.anch table{margin-top:8px;border-collapse:collapse;font-size:13px;width:100%}
details.anch td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
details.anch td:first-child{white-space:nowrap;font-weight:800;color:var(--ink);width:64px}
details.anch tr.cur td{background:var(--gk-soft)}
details.anch tr.cur td:first-child{color:var(--gk)}
details.anch .src{font-size:11.5px;color:var(--faint);margin-top:4px}
.thread{display:flex;flex-direction:column;gap:10px}
.cm{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px;font-size:14px}
.cm img{width:28px;height:28px;border-radius:50%}
.cm .h{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cm .h b{color:var(--ink)}
.cm .x{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line2);border-radius:4px 10px 10px 10px;padding:7px 11px;margin-top:3px}
.cm .del{background:none;border:0;color:var(--faint);font-size:12.5px;padding:0}
.cm .del:hover{color:var(--bad)}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;min-height:42px;max-height:200px;resize:vertical;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.compose textarea:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}
/* cột phải */
.pane{position:sticky;top:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - var(--hdr-h) - 28px);min-width:0}
.sumcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--gk-fill);background:linear-gradient(180deg,var(--gk-soft) 0,#fff 130px);flex:none}
.sum-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sum-top .lbl{font-size:12px;font-weight:800;color:var(--gk);text-transform:uppercase;letter-spacing:.06em}
.sum-top .big{font-family:var(--f-disp);font-size:44px;font-weight:800;color:var(--gk);line-height:1}
.sum-top .big small{font-size:17px;color:var(--muted);font-weight:700}
.sum-top .delta{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.sum-r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sum-cmp{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sum-foot{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;flex-wrap:wrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp>div{border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;border:1px solid}
.cmp .c-ai{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.cmp .c-hd{background:var(--hd-soft);border-color:var(--hd-line);color:var(--hd)}
.cmp b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1.2}
.cmp em{display:block;font-style:normal;color:var(--muted);font-size:12px;font-weight:500}
.gbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px 10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600}
.gbar b{color:var(--gk);font-variant-numeric:tabular-nums}
.status{font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sumcard details summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:13px}
.panebox{display:flex;flex-direction:column;min-height:260px;overflow:hidden;flex:1 1 auto}
.panebox .tabs{padding:0 10px;flex:none}
.panebody{padding:14px 18px;overflow:auto;min-height:0}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.prose{white-space:pre-line;font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.files{display:flex;flex-direction:column;gap:6px}
.files a{display:flex;gap:10px;align-items:center;font-size:13.5px;text-decoration:none;padding:7px 10px 7px 7px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-weight:600;background:#fff}
.files a:hover{border-color:var(--brand);background:var(--brand-soft2)}
.files a span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.files a em{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap;font-weight:500}
.files a .fx,.fx{flex:none;width:38px;overflow:visible;height:26px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:800;letter-spacing:.03em;background:var(--panel2);color:#334155;border:1px solid var(--line)}
.fx.pdf{background:#fee2e2;color:#b91c1c;border-color:#fca5a5}.fx.doc{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)}
.fx.xls{background:var(--good-soft);color:var(--good);border-color:var(--good-line)}.fx.ppt{background:var(--gk-soft);color:var(--gk);border-color:var(--gk-line)}
.fx.img{background:var(--ai-soft);color:var(--ai);border-color:var(--ai-line)}
.fgrp{font-size:12px;font-weight:800;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.sec h3{font-size:12.5px;margin:18px 0 7px;color:var(--brand-ink);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-body);font-weight:800;display:flex;align-items:center;gap:7px}
.sec h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--hc,var(--brand-fill))}
.sec h3:first-child{margin-top:0}
.sec h3.h-ok{--hc:var(--good-fill);color:var(--good)}.sec h3.h-bad{--hc:var(--bad);color:var(--bad)}.sec h3.h-warn{--hc:var(--warn-fill);color:var(--warn)}.sec h3.h-ai{--hc:var(--ai-fill);color:var(--ai)}
.sec ul{margin:0;padding-left:18px;font-size:14px}

<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById("miv-data").textContent);
const C = D.criteria, P = D.products, N = P.length;
const byStt = new Map(P.map(p => [p.stt, p]));
const $ = s => document.querySelector(s);
const main = $("#main");

/* ---------- state ---------- */
const S = {
  route: "tong-quan", q: "", terms: [], hlOn: true,
  sort: { key: "stt", dir: 1 }, f: { text: "", grade: "", scope: "", judge: "" }, ttab: "all", showTC: false,
  miv: null, cfg: null, cfgServer: null, cfgSaving: false, cfgDirtyQ: false, meUname: "", isAdmin: false, hideExcl: true,
  basis: "ai", cmFilter: "", tab: "hoso", openR: {}, openCm: {}, openV3: {},
  mode: "local", canWrite: false, dbReady: false, myId: null, meName: "", meAvatar: "",
  judges: {}, mine: null, profiles: {}, drafts: {}, savedAt: null,
  db: null, user: null, dl: null, dragging: false, pendingRender: false,
};

/* ---------- helpers ---------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const FOLD = new Map();
function foldChar(ch) { let r = FOLD.get(ch); if (r !== undefined) return r; r = (ch === "đ" || ch === "Đ") ? "d" : ch.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); FOLD.set(ch, r); return r; }
function fold(s) { let o = ""; for (const ch of String(s || "")) o += foldChar(ch); return o; }
function foldMap(s) { let n = ""; const st = [], en = []; let i = 0; for (const ch of s) { const f = foldChar(ch); for (let k = 0; k < f.length; k++) { n += f[k]; st.push(i); en.push(i + ch.length); } i += ch.length; } return { n, st, en }; }
function hl(text) {
  text = text == null ? "" : String(text);
  if (!S.hlOn || !S.terms.length || !text) return esc(text);
  const { n, st, en } = foldMap(text); const rs = [];
  for (const t of S.terms) { let from = 0, ix; while ((ix = n.indexOf(t, from)) !== -1) { rs.push([st[ix], en[ix + t.length - 1]]); from = ix + t.length; } }
  if (!rs.length) return esc(text);
  rs.sort((a, b) => a[0] - b[0]); const m = [rs[0].slice()];
  for (const r of rs.slice(1)) { const l = m[m.length - 1]; if (r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else m.push(r.slice()); }
  let o = "", p = 0; for (const [a, b] of m) { o += esc(text.slice(p, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; p = b; }
  return o + esc(text.slice(p));
}
const hasHit = text => S.terms.length && S.terms.some(t => fold(text).includes(t));
const URL_RE = /(https?:\/\/[^\s<>"')\]]+)/g;
function rich(text) { return String(text || "").split(URL_RE).map((s, i) => i % 2 ? `<a href="${esc(s.replace(/[.,;:]+$/, ""))}" target="_blank" rel="noopener noreferrer">${hl(s)}</a>` : hl(s)).join(""); }
const fmt1 = v => v == null ? "—" : (Math.round(v * 10) / 10).toLocaleString("vi-VN");
const fmtT = iso => { try { return new Date(iso).toLocaleString("vi-VN", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const fmtHM = d => { try { return d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => a.length ? sum(a) / a.length : null;
function grade(t) { if (t == null) return null; for (const [th, lb] of D.grades) if (t >= th) return lb; return "Yếu"; }
const GCLS = { "Xuất sắc": "g-xs", "Tốt": "g-t", "Khá": "g-k", "Trung bình": "g-tb", "Yếu": "g-y" };
const gpill = t => { const g = grade(t); return g ? `<span class="pill ${GCLS[g]}">${g}</span>` : `<span class="mut">—</span>`; };
const cpill = (c, label) => { const k = fold(c); const cls = k.startsWith("cao") ? "c-cao" : k.startsWith("thap") ? "c-thap" : "c-tb"; return `<span class="pill ${cls}">${esc(label || c || "—")}</span>`; };
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
let toastT; function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
const band = (c, v) => (c.anchors || []).find(([lo, hi]) => v >= lo && v <= hi);
const BCLS = { ai: "ai", mine: "gk", avg: "hd" };
const svgI = d => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  box: svgI('<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),
  ai: svgI('<path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/>'),
  team: svgI('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>'),
  judge: svgI('<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="m16 11 2 2 4-4"/>'),
  chat: svgI('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
  xls: svgI('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'),
  csv: svgI('<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>'),
  json: svgI('<path d="M8 4H7a2 2 0 0 0-2 2v4l-2 2 2 2v4a2 2 0 0 0 2 2h1M16 4h1a2 2 0 0 1 2 2v4l2 2-2 2v4a2 2 0 0 1-2 2h-1"/>'),
};
function fext(name) {
  const e = String(name || "").split(".").pop().toLowerCase();
  const k = e === "pdf" ? "pdf" : /^docx?$/.test(e) ? "doc" : /^(xlsx?|csv)$/.test(e) ? "xls" : /^pptx?$/.test(e) ? "ppt" : /^(png|jpe?g|gif|webp|bmp)$/.test(e) ? "img" : "";
  return `<span class="fx ${k}">${esc((e.length <= 4 ? e : "FILE").toUpperCase())}</span>`;
}

/* ---------- search corpus ---------- */
const FIELDS = p => [
  ["Tên", p.name], ["Doanh nghiệp", p.company], ["Mô tả", p.desc], ["Link", p.link + " " + p.website],
  ["Tài liệu", p.files.map(f => f.name).join(" ")], ["Nhận xét AI", [p.ai.summary, p.ai.strengths, p.ai.weaknesses, p.ai.verify].join(" ")],
  ...p.ai.r.map((r, i) => ["Lý do TC" + (i + 1), r]),
];
const CORPUS = new Map(P.map(p => [p.stt, FIELDS(p).map(([k, v]) => [k, fold(v)])]));
function matchInfo(p) {
  if (!S.terms.length) return { ok: true, where: [] };
  const fields = CORPUS.get(p.stt).slice();
  const cms = CALC.cms.filter(c => c.stt === p.stt).map(c => fold(c.text)).join(" ");
  if (cms) fields.push(["Góp ý", cms]);
  const notes = Object.values(CALC.J).map(d => (d.notes || {})[p.stt] || "").join(" ");
  if (notes.trim()) fields.push(["Ghi chú GK", fold(notes)]);
  const ok = S.terms.every(t => fields.some(([, v]) => v.includes(t)));
  return { ok, where: ok ? fields.filter(([, v]) => S.terms.some(t => v.includes(t))).map(([k]) => k) : [] };
}

/* ---------- scoring model (giữ nguyên cấu trúc dữ liệu cũ) ---------- */
const AIV = (D.meta && D.meta.aiVer) || 1; // phien ban diem AI mac dinh (3 = cham lai theo nguong v3)
const emptyDoc = () => ({ scores: {}, notes: {}, confirmed: {}, comments: [], parts: {}, aiVer: AIV, updatedAt: null });
function judgeDocs() { const j = Object.assign({}, S.judges); if (S.myId && S.mine) j[S.myId] = S.mine; return j; }
function own(doc, stt, tt) { const v = doc && doc.scores && doc.scores[stt] ? doc.scores[stt][tt] : null; return typeof v === "number" ? v : null; }
function eff(doc, p, i) {
  const v = own(doc, p.stt, i + 1); if (v != null) return v;
  if (doc && (doc.aiVer || 1) !== AIV && scored(doc, p.stt)) { const h = (p.ai.hist && p.ai.hist[String(doc.aiVer || 1)]) || p.ai.s0; if (h) return h[i]; } // giam khao cham truoc khi doi diem AI: giu diem AI cua phien ban do

  const bd = band(c, shown);

  if (c.max <= 10) {
    input = `<div class="picker" role="radiogroup" aria-label="Điểm của tôi cho tiêu chí ${tt}">${Array.from({ length: c.max + 1 }, (_, v) => `<button role="radio" aria-checked="${v === shown}" class="${v === shown ? "on" : ""} ${v === a ? "ai" : ""}" data-act="pick" data-stt="${stt}" data-tt="${tt}" data-v="${v}" ${dis} title="${v === a ? "Điểm AI: " + v : v + " điểm"}">${v}</button>`).join("")}</div>`;

      <div class="rgw"><input class="rg" type="range" id="rg-${stt}-${tt}" min="0" max="${c.max}" step="1" value="${shown}" style="--p:${pct}%" data-range="${stt}:${tt}" aria-label="Điểm của tôi cho tiêu chí ${tt}" ${dis}><span class="ai-tick" style="left:calc(12px + (100% - 24px) * ${a / c.max})" title="Điểm AI: ${a}"></span></div>
      <button class="step" data-act="step" data-stt="${stt}" data-tt="${tt}" data-d="1" aria-label="Tăng 1 điểm" ${dis}>+</button>
      <input type="number" id="${dk}" inputmode="numeric" min="0" max="${c.max}" step="1" value="${shown}" data-score="${stt}:${tt}" aria-label="Nhập điểm tiêu chí ${tt}" ${S.canWrite ? "" : "readonly"}></div>`;

    if (e.key === "ArrowLeft") { location.hash = "sp-" + P[(i - 1 + N) % N].stt; }

    else if (e.key === "n" || e.key === "N") { const nx = nextTodo(stt); if (nx) location.hash = "sp-" + nx.stt; }
  }
});
let qT;
$("#q").addEventListener("input", e => {
  clearTimeout(qT); qT = setTimeout(() => {
    S.q = e.target.value; S.terms = fold(S.q).split(/\s+/).filter(t => t.length >= 2); markIx = -1;

window.addEventListener("hashchange", () => { const prev = S.route; S.route = parseRoute(); markIx = -1; if (prev !== S.route) { S.openCm = {}; } render(); window.scrollTo(0, 0); });

/* ---------- export ---------- */
function rowsSummary() {
  const head = ["STT", "ID", "Tên sản phẩm", "Doanh nghiệp", ...C.map(c => "AI TC" + c.tt + " (/" + c.max + ")"), "Tổng AI", ...C.map(c => "Của tôi TC" + c.tt), "Tổng của tôi", "Tôi đã xác nhận", ...C.map(c => "TB GK TC" + c.tt), "TB tổng GK", "Số GK đã chấm", "Xếp loại (của tôi)", "Độ tin cậy bằng chứng (AI)", "Số góp ý", "Nhận xét AI", "Phụ trách", "Trạng thái xét", "Dự thi nhiều nơi", "Cần xác minh quy mô", "Ghi chú phân công"];
  const rows = P.map(p => { const r = CALC.per.get(p.stt); return [p.stt, p.id, p.name, p.company, ...p.ai.s, r.ai, ...C.map((c, i) => eff(S.mine, p, i)), r.mine, isDone(p.stt) ? "x" : "", ...r.crit.map(v => v == null ? "" : Math.round(v * 10) / 10), r.avg == null ? "" : Math.round(r.avg * 10) / 10, r.n, grade(r.mine), p.ai.conf, CALC.cmCount.get(p.stt) || 0, p.ai.summary, ...(() => { const c = pcf(p.stt), jd = judgeOf(p.stt); return [jd ? uName(jd) : "", c.excl ? "Loại: " + c.excl : "Đang xét", c.multi ? "x" : "", c.verify ? "x" : "", c.note || ""]; })()]; });
  return [head, ...rows];
}
function csvOf(aoa) { return "﻿" + aoa.map(r => r.map(v => { const s = String(v == null ? "" : v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(",")).join("\r\n"); }
function loadXLSX() { return new Promise((res, rej) => { if (window.XLSX) return res(window.XLSX); const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = () => res(window.XLSX); s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function save(filename, data) {
  if (!S.dl) { toast("Chế độ xem này không tải file được."); return; }
  try { await S.dl.save({ filename, data }); toast("Đã tải " + filename); }
  catch (e) { if (e && e.code === "declined") return; toast(e && e.code === "rate_limited" ? "Đang có một hộp thoại tải file, thử lại sau giây lát." : "Không tải được file (" + ((e && e.code) || "lỗi") + ")."); }
}
async function doExport(kind) {
  compute(); const stamp = new Date().toISOString().slice(0, 10);
  if (kind === "csv") return save("MIV2026_bang_diem_" + stamp + ".csv", csvOf(rowsSummary()));
  if (kind === "copy") { const txt = rowsSummary().map(r => r.map(v => String(v == null ? "" : v).replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n"); try { await navigator.clipboard.writeText(txt); toast("Đã sao chép, dán vào Excel/Google Sheets."); } catch (e) { toast("Trình duyệt chặn sao chép."); } return; }
  const names = {}; for (const id of CALC.ids) names[id] = person(id).name;
  if (kind === "json") return save("MIV2026_sao_luu_" + stamp + ".json", JSON.stringify({ exportedAt: new Date().toISOString(), criteria: C, products: P, judges: Object.fromEntries(CALC.ids.map(id => [names[id], CALC.J[id]])) }, null, 1));
  if (kind === "xlsx") {
    let X; try { X = await loadXLSX(); } catch (e) { toast("Không tải được thư viện Excel. Dùng CSV thay thế."); return; }
    const wb = X.utils.book_new();
    const s1 = X.utils.aoa_to_sheet(rowsSummary()); s1["!cols"] = [{ wch: 5 }, { wch: 7 }, { wch: 40 }, { wch: 32 }]; X.utils.book_append_sheet(wb, s1, "Tổng hợp");
    const r2 = [["STT", "Tên sản phẩm", "TT", "Tiêu chí", "Tối đa", "Điểm AI", "Điểm của tôi", "TB GK", "Lý do AI chấm"]];
    P.forEach(p => C.forEach((c, i) => { const cv = CALC.per.get(p.stt).crit[i]; r2.push([p.stt, p.name, c.tt, c.name, c.max, p.ai.s[i], eff(S.mine, p, i), cv == null ? "" : Math.round(cv * 10) / 10, p.ai.r[i]]); }));
    const s2 = X.utils.aoa_to_sheet(r2); s2["!cols"] = [{ wch: 5 }, { wch: 34 }, { wch: 4 }, { wch: 36 }, { wch: 6 }, { wch: 7 }, { wch: 8 }, { wch: 7 }, { wch: 120 }]; X.utils.book_append_sheet(wb, s2, "Lý do AI");
    const r3 = [["Giám khảo", "STT", "Tên sản phẩm", ...C.map(c => "TC" + c.tt), "Tổng", "Đã xác nhận", "Ghi chú", "Cập nhật"]];
    CALC.ids.forEach(id => { const d = CALC.J[id]; P.forEach(p => { if (scored(d, p.stt)) r3.push([names[id], p.stt, p.name, ...C.map((c, i) => eff(d, p, i)), jTotal(d, p), d.confirmed && d.confirmed[p.stt] ? "x" : "", (d.notes || {})[p.stt] || "", d.updatedAt || ""]); }); });
    X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(r3), "Điểm từng GK");
    const r4 = [["Thời gian", "Giám khảo", "STT", "Tên sản phẩm", "Tiêu chí", "Nội dung"]];
    CALC.cms.slice().reverse().forEach(c => r4.push([fmtT(c.at), names[c.by] || "", c.stt, byStt.get(c.stt).name, c.tt ? "TC" + c.tt + ". " + C[c.tt - 1].short : "Góp ý chung", c.text]));
    const s4 = X.utils.aoa_to_sheet(r4); s4["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 5 }, { wch: 34 }, { wch: 22 }, { wch: 100 }]; X.utils.book_append_sheet(wb, s4, "Góp ý");
    const r5 = [["STT", "Tên sản phẩm", "TC", "Thành phần", "Loại", "Bậc", "Điểm", "Tối đa", "Tổng TC theo thành phần"]];
    P.forEach(p => C.forEach(c => { const e = v3eff(p, c.tt); if (!e.of || (!e.n && !e.hasAI)) return; v3parts(c.tt).forEach(x => { const ep = e.parts[x.k]; if (ep.v != null) r5.push([p.stt, p.name, c.tt, x.k + ". " + x.l, TLAB[x.t] + (ep.own ? " · GK sửa" : " · AI"), ep.v, ep.pts, lvPts(x, x.m), e.s]); }); }));
    if (r5.length > 1) X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(r5), "Ngưỡng v3 của tôi");
    return save("MIV2026_cham_diem_" + stamp + ".xlsx", new Blob([X.write(wb, { bookType: "xlsx", type: "array" })]));
  }
}

/* ---------- runtime ---------- */
async function boot() {
  S.route = parseRoute(); render();
  if (!window.claude || typeof window.claude.use !== "function") { S.mode = "local"; setSync("", "Bản xem tĩnh"); render(); return; }
  setSync("", "Đang kết nối…");
  let user = null, db = null, dl = null, miv = null;
  try { [user, db, dl, miv] = await Promise.all([window.claude.use("user"), window.claude.use("db"), window.claude.use("downloads"), Promise.resolve(window.claude.use("miv")).catch(() => null)]); } catch (e) { }
  S.user = user; S.dl = dl; S.miv = miv && typeof miv.watchConfig === "function" ? miv : null;
  if (user) { const me = await user.me(); S.myId = me.id; S.meName = me.name; S.meAvatar = me.avatarUrl; S.meUname = me.uname || ""; S.isAdmin = !!me.isAdmin; }
  if (!db) { S.mode = "local"; setSync("", "Chỉ xem"); render(); return; }
  S.db = db; S.mode = "live";
  if (S.miv) S.miv.watchConfig(c => {
    S.cfgServer = { version: c.version || 0, groups: Array.isArray(c.groups) ? c.groups : [], products: c.products || {}, users: c.users || [], updatedAt: c.updatedAt, updatedBy: c.updatedBy };
    if (!S.cfgSaving && !S.cfgDirtyQ) { S.cfg = S.cfgServer; render(); } // đang lưu thay đổi của mình thì chưa ghi đè
  });
  let can = null; try { can = user ? await user.can("data.write") : null; } catch (e) { }
  const writable = !!S.myId && can !== false;
  const timer = setTimeout(() => { if (!S.dbReady) { S.mode = "stale"; setSync("err", "Chưa kết nối"); render(); } }, 10000);
  db.collection("judges").onSnapshot(snap => {
    const j = {}; snap.docs.forEach(d => { if (d.exists) j[d.id] = d.data(); }); S.judges = j;
    if (!snap.metadata.fromCache && !S.dbReady) { clearTimeout(timer); S.dbReady = true; S.mode = "live"; S.canWrite = writable; setSync(S.canWrite ? "ok" : "", S.canWrite ? "Đã đồng bộ" : "Chỉ xem"); }
    if (!dirty && !saving) S.mine = S.myId ? JSON.parse(JSON.stringify(j[S.myId] || emptyDoc())) : null;
    if (S.mine) { S.mine.scores = S.mine.scores || {}; S.mine.notes = S.mine.notes || {}; S.mine.confirmed = S.mine.confirmed || {}; S.mine.comments = S.mine.comments || []; S.mine.parts = S.mine.parts || {}; }
    if (S.mine && S.canWrite && AIV > 1 && S.mine.aiVer !== AIV && !dirty && !saving) {
      // diem AI mac dinh vua doi: chot diem AI cu vao nhung san pham ban da cham de diem cua ban khong doi
      for (const p of P) { const h = (p.ai.hist && p.ai.hist[String(S.mine.aiVer || 1)]) || p.ai.s0; if (h && scored(S.mine, p.stt)) { const sc = (S.mine.scores[p.stt] = S.mine.scores[p.stt] || {}); C.forEach((c, i) => { if (typeof sc[c.tt] !== "number") sc[c.tt] = h[i]; }); } }
      S.mine.aiVer = AIV; touch(true); // khong hien thong bao
    }
    render(); refreshProfiles();
  }, err => { clearTimeout(timer); S.mode = "stale"; S.canWrite = false; setSync("err", err && err.code === "revoked" ? "Mất quyền truy cập" : "Mất kết nối"); render(); });
}
boot();
})();
